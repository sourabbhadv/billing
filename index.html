<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Stock & Billing</title>
<meta name="theme-color" content="#0f6e56">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6a64;--ac:#0f6e56;--ac2:#e1f5ee;--bd:#dedcd4;--rd:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#161614;--card:#222220;--tx:#eeede8;--mu:#9a9990;--ac:#3fbf9a;--ac2:#18352c;--bd:#3a3a36;--rd:#f2877f}}
*{box-sizing:border-box;touch-action:manipulation}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;max-width:640px;margin:0 auto;padding-bottom:70px}
header{padding:14px 14px 4px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:18px;margin:0}h2{font-size:15px;margin:14px 0 6px}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;gap:6px;padding:8px 12px;z-index:5}
nav button{flex:1;padding:9px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;font-size:14px}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#v{padding:4px 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin:8px 0}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin:3px 0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button.b{padding:9px 12px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;font-weight:600}
button.s{padding:6px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;font-size:13px}
.mu{color:var(--mu);font-size:13px}.red{color:var(--rd);font-weight:600}.grn{color:var(--ac);font-weight:600}
.ok{background:var(--ac2);border-radius:10px;padding:10px;margin:8px 0}

.hid{display:none}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.stat{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}.stat b{font-size:22px;display:block;margin-top:2px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th{text-align:left;background:var(--ac2);padding:8px;font-size:13px}.tbl td{padding:6px 8px;border-bottom:1px solid var(--bd);vertical-align:middle}.tbl input{margin:0}
.bars{display:flex;gap:8px;align-items:flex-end;height:120px;margin-top:8px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.bars i{display:block;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px;margin-bottom:3px}
.addb{background:#e4405f!important;color:#fff!important}
.mob{display:inline-block}@media(min-width:900px){.mob{display:none}}.hsplit{display:block}.pend{max-height:75vh;overflow-y:auto}@media(min-width:1100px){.hsplit{display:grid;grid-template-columns:1fr 340px;gap:14px;align-items:start}}
nav{overflow-x:auto}nav button{flex:0 0 auto;padding:9px 12px;white-space:nowrap}
@media(min-width:900px){body{max-width:none;margin:0;padding:0 0 0 210px}header{position:fixed;left:0;top:0;width:210px;background:#12122b;color:#fff;padding:16px 14px;display:block;z-index:6}header .mu{color:#9aa;display:block;margin-top:2px}
nav{position:fixed;left:0;top:96px;bottom:0;width:210px;flex-direction:column;background:#12122b;padding:8px;gap:2px}nav button{flex:none;text-align:left;background:transparent;border:0;color:#dde;padding:13px 14px;font-size:15px;border-radius:0}nav button.on{background:#2b2b55;border-left:3px solid #e4405f;color:#fff}
#v{padding:16px 22px;max-width:1250px}.split{display:grid;grid-template-columns:340px 1fr;gap:14px;align-items:start}.hid{display:block}}

#top{display:flex;gap:8px;align-items:center;padding:8px 12px;flex-wrap:wrap}#top input{flex:1;min-width:140px;margin:0}
nav .sb{display:none}nav button.gon{background:var(--ac);color:#fff;border-color:var(--ac)}
.pills{display:flex;gap:6px;overflow-x:auto;margin:6px 0 4px}.pills button{flex:0 0 auto;white-space:nowrap}
@media(min-width:900px){nav .sb{display:block!important;padding-left:30px!important;font-size:14px!important}.pills{display:none}#top{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--bd);z-index:4}nav button.gon{background:transparent;color:#fff;font-weight:700;border:0}}/* ===== Vyapar look (v3) ===== */
:root,:root:not([data-theme="light"]){color-scheme:light;--bg:#eef1f7;--card:#fff;--tx:#1f2437;--mu:#7b8194;--ac:#1a73e8;--ac2:#d6e9f9;--bd:#e4e8f0;--rd:#e5333f;--gn:#17a56b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:light;--bg:#eef1f7;--card:#fff;--tx:#1f2437;--mu:#7b8194;--ac:#1a73e8;--ac2:#d6e9f9;--bd:#e4e8f0;--rd:#e5333f;--gn:#17a56b}}
html{scroll-behavior:smooth}body{font-family:Roboto,system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.card{border:0;border-radius:6px;box-shadow:0 1px 4px rgba(25,35,80,.10);transition:box-shadow .2s}
input,select,textarea{background:#fff;border:1px solid #cfd5e3;border-radius:6px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:#1a73e8;box-shadow:0 0 0 3px rgba(26,115,232,.15)}
button{cursor:pointer;transition:background .15s,box-shadow .15s,transform .08s}button:active{transform:scale(.97)}
button.b{background:#1a73e8;border-radius:999px;padding:10px 18px;box-shadow:0 1px 3px rgba(26,115,232,.35)}button.b:hover{box-shadow:0 3px 8px rgba(26,115,232,.4)}
.addb{background:#e8213a!important;border-radius:999px!important;box-shadow:0 1px 3px rgba(232,33,58,.35)!important}
button.s{border-radius:999px;background:#eaf2fe;border:0;color:#1a56b8;font-weight:500;padding:7px 14px}button.s:hover{background:#d8e8fc}
button.dlb{background:#fdecee;color:#d21f30}button.dlb:hover{background:#fbd5da}
.grn{color:var(--gn)}.red{color:var(--rd)}
.tbl th{background:#f4f6fb;color:#5d647a;font-weight:500;border-bottom:1px solid var(--bd);padding:11px 10px}.tbl td{padding:9px 10px;border-bottom:1px solid #eef0f5}.tbl tr:hover td{background:#f6f9ff}
.eln{border:1px solid transparent!important;background:transparent!important;padding:7px!important;box-shadow:none}.eln:hover{border-color:#cfd5e3!important}.eln:focus{background:#fff!important;border-color:#1a73e8!important}
.stat{border:0;border-radius:6px;box-shadow:0 1px 4px rgba(25,35,80,.10)}
@media(min-width:900px){header,nav{background:#101338!important}header h1{font-size:17px}nav button{font-size:15px;transition:background .15s;padding:14px 16px!important}nav button:hover{background:#1b1f55!important}nav button.on{background:#1d2160!important;border-left:4px solid #e8213a!important}nav .sb{opacity:.9}
#top{box-shadow:0 1px 3px rgba(25,35,80,.08);padding:10px 22px}#top input{border-radius:999px;border-color:transparent;background:#f1f3f8}#v{padding:18px 24px}}
</style><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"></head><body>
<header><h1 id="sh" onclick="rename()"></h1><span class="mu" id="sy">tap name to edit</span></header>
<nav><button id="t-home" onclick="go('home')">Home</button><button id="t-bill" onclick="go('bill')">Sale</button><button id="t-party" onclick="go('party')">Parties</button><button id="t-stock" onclick="go('stock')">Items</button><button id="t-tx" onclick="go('tx')">Transactions</button><button id="t-rep" onclick="go('rep')">Reports</button><button id="t-bk" onclick="go('bk')">Backup</button></nav>
<div id="v"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.78.0/dist/umd/supabase.js"></script>
<script>
var $=function(s){return document.querySelector(s)};
var D=null;try{D=JSON.parse(localStorage.getItem('sb')||'null')}catch(e){}
D=D||{shop:'Ashirwad Tiles',items:[],parties:[],bills:[],pays:[],seq:1};
function save(){try{localStorage.setItem('sb',JSON.stringify(D))}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(n){return '₹'+(Math.round(n*100)/100).toLocaleString('en-IN')}
function dt(i){return new Date(i).toLocaleDateString('en-IN')}
function P(id){return D.parties.find(function(p){return p.id===id})}
function I(id){return D.items.find(function(p){return p.id===id})}
function bal(p){var b=+p.open||0;D.bills.forEach(function(x){if(x.pid===p.id)b+=x.total});D.pays.forEach(function(x){if(x.pid===p.id)b-=x.amt});return b}
function balTxt(b){return b>0?'<span class="red">'+money(b)+' to receive</span>':b<0?'<span class="grn">'+money(-b)+' advance</span>':'<span class="mu">Nil</span>'}
var tab='home',draft={pid:'',lines:[]},last=null,openP=null,openB=null;
var viewB=null;
function go(t){tab=t;openP=null;openB=null;viewB=null;lastDisp=null;openI=null;render()}
function rename(){var n=prompt('Shop name',D.shop);if(n){D.shop=n;save();render()}}
function render(){
 $('#sh').textContent=D.shop;
 ['home','bill','stock','party','tx','rep','bk'].forEach(function(t){$('#t-'+t).classList.toggle('on',tab===t)});
 $('#v').innerHTML=tab==='home'?vHome():tab==='bill'?(openB?vDispatch():viewB?vBillView():vBill2()):tab==='stock'?vStock():tab==='party'?'<div class="split"><div class="'+(openP?'hid':'')+'">'+vParty()+'</div><div>'+(openP?vLedger():'<div class="card mu">Click a party to see its ledger</div>')+'</div></div>':tab==='rep'?vRep():tab==='tx'?vTx():vBk();
}
/* ---------- BILL ---------- */
function vBill(){
 var h='';
 if(last){var b=D.bills.find(function(x){return x.no===last});if(b)h+='<div class="ok">Bill #'+b.no+' saved. <button class="b" onclick="wa('+b.no+')">Send on WhatsApp</button></div>'}
 if(!D.parties.length||!D.items.length)return h+'<div class="card">First add at least one party (Parties tab) and one item (Stock tab).</div>';
 h+='<div class="card"><b>New bill</b><select onchange="draft.pid=this.value"><option value="">Select party</option>'+D.parties.map(function(p){return '<option value="'+p.id+'"'+(draft.pid===p.id?' selected':'')+'>'+esc(p.name)+'</option>'}).join('')+'</select>';
 h+='<select id="bi" onchange="var i=I(this.value);$(\'#br\').value=i?i.rate:\'\'"><option value="">Select item</option>'+D.items.map(function(i){return '<option value="'+i.id+'">'+esc(i.name)+' ('+i.qty+' '+esc(i.unit)+')</option>'}).join('')+'</select>';
 h+='<div class="g"><input id="bq" type="number" inputmode="decimal" placeholder="Qty"><input id="br" type="number" inputmode="decimal" placeholder="Rate"></div><button class="s" onclick="addLine()">+ Add item</button>';
 var tot=0;
 draft.lines.forEach(function(l,k){tot+=l.amt;h+='<div class="row" style="margin-top:6px"><span>'+esc(l.name)+'<br><span class="mu">'+l.qty+' × '+l.rate+'</span></span><span>'+money(l.amt)+' <button class="s" onclick="draft.lines.splice('+k+',1);render()">✕</button></span></div>'});
 if(draft.lines.length){h+='<div class="row" style="margin-top:8px"><b>Total</b><b>'+money(tot)+'</b></div><input id="bp" type="number" inputmode="decimal" placeholder="Paid now (optional)"><button class="b" style="width:100%;margin-top:6px" onclick="saveBill()">Save bill</button>'}
 h+='</div><h2>Recent bills</h2>';
 D.bills.slice(-15).reverse().forEach(function(b){var p=P(b.pid);h+='<div class="card row"><span style="cursor:pointer" onclick="viewB='+b.no+';render()">#'+b.no+' '+esc(p?p.name:'?')+'<br><span class="mu">'+dt(b.date)+pend(b)+'</span></span><span>'+money(b.total)+'<br><button class="s" onclick="openB='+b.no+';render()">Dispatch</button> <button class="s" onclick="wa('+b.no+')">WhatsApp</button></span></div>'});
 return h;
}
function addLine(){
 var i=I($('#bi').value),q=+$('#bq').value,r=+$('#br').value;
 if(!i||!(q>0)||!(r>=0)||$('#br').value==='')return alert('Select item and enter qty and rate');
 if(q>i.qty&&!confirm('Only '+i.qty+' '+i.unit+' in stock. Add anyway?'))return;
 draft.lines.push({iid:i.id,name:i.name,unit:i.unit,qty:q,rate:r,amt:q*r,nowq:Math.min(+(($('#bs')||{}).value)||0,q)});render();
}
function saveBill(){
 if(!draft.pid)return alert('Select a party');
 var paid=+($('#bp').value||0),total=draft.lines.reduce(function(a,l){return a+l.amt},0),no=D.seq++;
 draft.lines.forEach(function(l){var i=I(l.iid);if(i)i.qty=Math.round((i.qty-l.qty)*100)/100});
 D.bills.push({no:no,pid:draft.pid,date:Date.now(),lines:draft.lines,total:total,paid:paid});
 if(paid>0)D.pays.push({id:uid(),pid:draft.pid,date:Date.now(),amt:paid,note:'With bill #'+no});
 save();last=no;draft={pid:'',lines:[]};render();
}
function phone(p){var d=String(p.phone||'').replace(/\D/g,'');return d.length===10?'91'+d:d}
function openWA(p,text){if(!phone(p))return alert('Add a phone number for this party first');window.open('https://wa.me/'+phone(p)+'?text='+encodeURIComponent(text),'_blank')}
function wa(no){
 var b=D.bills.find(function(x){return x.no===no}),p=P(b.pid);if(!p)return;
 var t='Namaste '+p.name+',\nBill #'+b.no+' ('+dt(b.date)+') from '+D.shop+'\n\n';
 b.lines.forEach(function(l){t+=l.name+': '+l.qty+' '+l.unit+' × '+l.rate+' = '+money(l.amt)+'\n'});
 t+='\nBill total: '+money(b.total);
 if(b.paid>0)t+='\nPaid: '+money(b.paid);
 var bl=bal(p);t+='\nTotal pending balance: '+money(bl>0?bl:0)+'\n\nThank you!';
 openWA(p,t);
}
/* ---------- BILL v2: type party and items directly ---------- */
function vBill2(){
 var h='';
 if(last){var lb=D.bills.find(function(x){return x.no===last});if(lb)h+='<div class="ok">Bill #'+lb.no+' saved. <button class="b" onclick="wa('+lb.no+')">Send text</button> <button class="b" onclick="shareBill('+lb.no+')">Send bill picture</button></div>'}
 var eb=draft.edit?bl(draft.edit):null,nextNo=D.bills.reduce(function(m,x){return Math.max(m,x.no)},0)+1;
 if(eb)h+='<div class="ok">Editing bill #'+eb.no+' <button class="s" onclick="draft={pid:\'\',name:\'\',phone:\'\',lines:[]};viewB='+eb.no+';render()">Cancel edit</button></div>';
 h+='<h2 style="font-size:20px;margin-top:4px">'+(eb?'Edit bill':'Sale')+'</h2><div class="card"><div class="split" style="grid-template-columns:1fr 1fr 220px;gap:10px"><div><input id="bn" list="pl" placeholder="Customer name *" autocomplete="off" value="'+esc(draft.name||'')+'" oninput="draft.name=this.value;fillP()"><datalist id="pl">'+D.parties.map(function(p){return '<option value="'+esc(p.name)+'">'}).join('')+'</datalist><div id="bb" class="mu"></div></div><div><input id="bph" type="tel" placeholder="Phone number" value="'+esc(draft.phone||'')+'" oninput="draft.phone=this.value"></div><div class="mu" style="text-align:right">Invoice No: <b>'+(eb?eb.no:nextNo)+'</b><br>Date: <b>'+(eb?dt(eb.date):new Date().toLocaleDateString('en-IN'))+'</b></div></div></div>';
 var tot=0,rows='';
 draft.lines.forEach(function(l,k){tot+=l.amt;rows+='<tr><td>'+(k+1)+'</td><td style="min-width:160px">'+elnIn(k,'name',l.name,'text')+'</td><td style="width:80px">'+elnIn(k,'qty',l.qty,'number')+'</td><td style="width:90px">'+elnIn(k,'unit',l.unit,'text')+'</td><td style="width:100px">'+elnIn(k,'rate',l.rate,'number')+'</td><td>'+money(l.amt)+'</td><td>'+sentCell(l,k)+'</td><td><button class="s" onclick="draft.lines.splice('+k+',1);render()">✕</button></td></tr>'});
 h+='<div class="card" style="overflow-x:auto"><datalist id="il">'+D.items.map(function(i){return '<option value="'+esc(i.name)+'">'}).join('')+'</datalist><table class="tbl"><tr><th>#</th><th>Item</th><th>Qty</th><th>Unit</th><th>Price/Unit</th><th>Amount</th><th>Sent</th><th></th></tr>'+rows+'<tr><td>+</td><td style="min-width:160px"><input id="bi" list="il" placeholder="Item name" autocomplete="off" oninput="fillI(this.value)"></td><td style="width:80px"><input id="bq" type="number" inputmode="decimal" placeholder="Qty" oninput="rowAmt()"></td><td style="width:90px"><input id="bu" placeholder="Unit"></td><td style="width:100px"><input id="br" type="number" inputmode="decimal" placeholder="Rate" oninput="rowAmt()" onkeydown="if(event.key===\'Enter\')addLine2()"></td><td id="ba" style="width:90px"></td><td style="white-space:nowrap"><input type="checkbox" id="bk" style="width:22px;height:22px;margin:0 6px 0 0;vertical-align:middle" onchange="bkTick(this.checked)"><input id="bs" type="number" inputmode="decimal" placeholder="Sent now" style="width:84px;margin:0" oninput="bsType()"></td><td><button class="s addb" onclick="addLine2()">Add</button></td></tr></table></div>';
 h+='<div class="card" style="max-width:420px;margin-left:auto"><div class="row"><b>Total</b><b>'+money(tot)+'</b></div><input id="bp" type="number" inputmode="decimal" placeholder="Received (leave empty if none)" value="'+(draft.paid||'')+'" oninput="dueNow('+tot+')"><div id="dn" class="mu" style="margin:2px 2px 8px">Balance: full '+money(tot)+' will stay pending</div><button class="b" style="width:100%" onclick="if(!draft.lines.length)return alert(\'Add at least one item first\');draft.edit?saveEdit():saveBill2()">'+(eb?'Save changes':'Save bill')+'</button></div>';
 h+='<h2>Recent bills</h2>';
 D.bills.slice(-15).reverse().forEach(function(b){var p=P(b.pid);h+='<div class="card row"><span style="cursor:pointer" onclick="viewB='+b.no+';render()">#'+b.no+' '+esc(p?p.name:'?')+'<br><span class="mu">'+dt(b.date)+pend(b)+'</span></span><span>'+money(b.total)+'<br><button class="s" onclick="openB='+b.no+';render()">Dispatch</button> <button class="s" onclick="wa('+b.no+')">WhatsApp</button></span></div>'});
 setTimeout(function(){fillP();var e=$('#bp');if(e&&e.value)dueNow(tot)},0);
 return h;
}
function bLink(no,t){return '<a href="#" style="color:var(--ac);font-weight:600" onclick="tab=\'bill\';openB=null;viewB='+no+';render();return false">'+(t||no)+'</a>'}
function vBillView(){
 var b=bl(viewB);if(!b){viewB=null;return vBill2()}
 var p=P(b.pid),pd=paidOn(b),due=Math.max(b.total-pd,0),h='<button class="s" onclick="viewB=null;render()">← Back</button><h2 style="font-size:20px;margin:8px 0">Bill #'+b.no+(b.x?' <span class="red">(Cancelled)</span>':'')+'</h2>';
 h+='<div class="card row"><span><b>'+esc(p?p.name:'?')+'</b><br><span class="mu">'+esc(p&&p.phone||'')+'</span></span><span class="mu">'+dt(b.date)+'</span></div>';
 h+='<div class="card">'+tbl(['#','Item','Qty','Unit','Rate','Amount','Sent'],b.lines.map(function(l,k){return [k+1,esc(l.name)+locTag(l),l.qty,esc(l.unit),l.rate,money(l.amt),dq(l)+'/'+l.qty]}))+'<div class="row" style="margin-top:8px"><b>Total</b><b>'+money(b.total)+'</b></div><div class="row"><span>Received</span><span class="grn">'+money(pd)+'</span></div><div class="row"><span>Due</span><b class="'+(due>0?'red':'grn')+'">'+money(due)+'</b></div></div>';
 h+='<div style="display:flex;gap:6px;flex-wrap:wrap">'+(b.x?'<button class="b" onclick="restoreBill('+b.no+')">Restore bill</button>':'<button class="b" onclick="editBill('+b.no+')">Edit bill</button><button class="s" onclick="recvBill('+b.no+')">Receive</button><button class="s" onclick="openB='+b.no+';render()">Dispatch</button><button class="s" onclick="wa('+b.no+')">WhatsApp</button><button class="s" onclick="shareBill('+b.no+')">Bill picture</button><button class="s" onclick="cancelBill('+b.no+')">Cancel bill</button>')+'</div>';
 return h;
}
function editBill(no){
 var b=bl(no);if(!b)return;if(b.x)return alert('This bill is cancelled. Press Restore first, then Edit.');
 var p=P(b.pid);draft={pid:b.pid,name:p?p.name:'',phone:(p&&p.phone)||'',lines:JSON.parse(JSON.stringify(b.lines)),edit:no,paid:+b.paid||0};viewB=null;tab='bill';render();
}
function saveEdit(){
 var no=draft.edit,b=bl(no);if(!b)return;
 var nm=(draft.name||'').trim();if(!nm)return alert('Enter party name');
 if(!draft.lines.length)return alert('Add at least one item');
 var ph=(draft.phone||'').trim(),p=findP(nm);
 if(!p){p={id:uid(),name:nm,phone:ph,open:0};D.parties.push(p)}else if(ph&&p.phone!==ph)p.phone=ph;
 b.lines.forEach(function(l){var i=I(l.iid);if(i)i.qty=Math.round((i.qty+l.qty)*100)/100});
 var total=0;
