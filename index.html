<script id="acct-guard">
/* ACCOUNT GUARD: data kept on this device belongs to ONE account (its owner).
   When another account signs in on the same device, the owner's data is moved aside (safe copy, nothing deleted)
   and the new account sees only its own data. When the owner signs in again, the data comes back. */
(function(){
 var KEYS=['sb','lvBase','lvFile','lvStamp','lvOn','lvTok','gdFolder','gdDay','gdAt','gdErr','gdLinked','gdOn','gdEmail','gdWho','sbLic','bkLocalAt','bkFileDay'];
 var hold=0,bypass=0,busy=0;
 function LS(k){try{return localStorage.getItem(k)}catch(e){return null}}
 var _si=Storage.prototype.setItem;
 Storage.prototype.setItem=function(k,v){if(hold&&!bypass&&KEYS.indexOf(k)>=0)return;return _si.apply(this,arguments)};
 if(window.IDBObjectStore){['put','add','delete','clear'].forEach(function(m){var o=IDBObjectStore.prototype[m];IDBObjectStore.prototype[m]=function(){if(hold&&!bypass)return;return o.apply(this,arguments)}})}
 function sessEmail(){try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(/^sb-.*-auth-token$/.test(k)){var v=JSON.parse(localStorage.getItem(k)||'null'),u=v&&(v.user||(v.currentSession&&v.currentSession.user));if(u&&u.email)return String(u.email).toLowerCase()}}}catch(e){}return ''}
 function idb(){return new Promise(function(res,rej){if(!window.indexedDB)return rej(new Error('no idb'));var r=indexedDB.open('sbBackup',1);r.onupgradeneeded=function(){var d=r.result;if(!d.objectStoreNames.contains('snaps'))d.createObjectStore('snaps',{keyPath:'day'});if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv')};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
 function run(d,stores,mode,fn){return new Promise(function(res,rej){var t=d.transaction(stores,mode),out;bypass=1;try{out=fn(t)}finally{bypass=0}t.oncomplete=function(){res(out)};t.onerror=t.onabort=function(){rej(t.error||new Error('idb'))}})}
 function cover(){try{if(document.getElementById('acctov'))return;var o=document.createElement('div');o.id='acctov';o.style.cssText='position:fixed;inset:0;background:#101338;color:#fff;z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font:18px/1.4 sans-serif';o.textContent='Switching account\u2026 your shop data stays safe.';(document.body||document.documentElement).appendChild(o)}catch(e){}}
 function swap(newEm,oldOwner){
  if(busy)return Promise.resolve();busy=1;hold=1;cover();
  var ls={};KEYS.forEach(function(k){var v=LS(k);if(v!==null)ls[k]=v});
  var newPark=null,d0;
  return idb().then(function(d){d0=d;
   return run(d,['snaps','kv'],'readonly',function(t){return {s:t.objectStore('snaps').getAll(),p:t.objectStore('kv').get('park:'+newEm)}})})
  .then(function(r){newPark=r.p.result||null;var oldPark={ls:ls,snaps:r.s.result||[],t:Date.now()};
   return run(d0,['kv'],'readwrite',function(t){t.objectStore('kv').put(oldPark,'park:'+oldOwner)})})
  .then(function(){return run(d0,['kv'],'readonly',function(t){return t.objectStore('kv').get('park:'+oldOwner)})})
  .then(function(v){var p=v.result;if(!p||JSON.stringify(p.ls)!==JSON.stringify(ls))throw new Error('verify');
   /* the safe copy is stored and checked: now switch what this device shows */
   bypass=1;try{
    KEYS.forEach(function(k){localStorage.removeItem(k)});
    if(newPark&&newPark.ls)Object.keys(newPark.ls).forEach(function(k){if(KEYS.indexOf(k)>=0)localStorage.setItem(k,newPark.ls[k])});
    localStorage.setItem('sbOwner',newEm)
   }catch(e){try{KEYS.forEach(function(k){localStorage.removeItem(k)});Object.keys(ls).forEach(function(k){localStorage.setItem(k,ls[k])})}catch(x){}throw e}finally{bypass=0}
   return run(d0,['snaps','kv'],'readwrite',function(t){var ss=t.objectStore('snaps');ss.clear();if(newPark&&newPark.snaps)newPark.snaps.forEach(function(x){ss.put(x)});t.objectStore('kv').delete('park:'+newEm)})})
  .then(function(){location.reload()},function(){
   /* could not move the data safely: leave it untouched and sign this account out */
   hold=0;try{Object.keys(localStorage).forEach(function(k){if(/^sb-.*-auth-token/.test(k))localStorage.removeItem(k)})}catch(e){}
   try{alert('This phone or computer holds another account\u2019s data and it could not be switched safely. Nothing was deleted. You have been signed out.')}catch(e){}
   location.reload()})}
 window.acctCheck=function(email){
  email=String(email||'').toLowerCase();if(!email)return false;
  var o=LS('sbOwner');
  if(!o){try{localStorage.setItem('sbOwner',email)}catch(e){}return false}
  if(o===email)return false;
  swap(email,o);return true};
 /* at start: a signed-in account that is not the owner must never see the owner's data */
 (function(){var se=sessEmail();if(se)window.acctCheck(se)})();
 /* after a sign-in on this page */
 document.addEventListener('DOMContentLoaded',function(){var f=window.sbReady;if(typeof f!=='function')return;
  window.sbReady=function(ss){var em=ss&&ss.user&&ss.user.email;if(window.acctCheck(em))return;return f.apply(this,arguments)}});
})();
</script>

<script>
var $=function(s){return document.querySelector(s)};
/* SPEED: build each number/date/sort formatter once and reuse it (the browser was rebuilding it for every single number, date and name) */
(function(){var cN={},cD={},cC={},oN=Number.prototype.toLocaleString,oD=Date.prototype.toLocaleDateString,oC=String.prototype.localeCompare;
function key(l,o){return String(l)+'|'+(o?JSON.stringify(o):'')}
Number.prototype.toLocaleString=function(l,o){try{var k=key(l,o),f=cN[k]||(cN[k]=new Intl.NumberFormat(l,o));return f.format(this)}catch(e){return oN.call(this,l,o)}};
Date.prototype.toLocaleDateString=function(l,o){try{var k=key(l,o),f=cD[k]||(cD[k]=new Intl.DateTimeFormat(l,o));return f.format(this)}catch(e){return oD.call(this,l,o)}};
String.prototype.localeCompare=function(b,l,o){try{var k=key(l,o),f=cC[k]||(cC[k]=new Intl.Collator(l,o));return f.compare(this,b)}catch(e){return oC.call(this,b,l,o)}};
})();
var PDN=60,_pdSel=null;/* ledger rows shown at a time */
/* Free edition: no Supabase auth cleanup. Local business data must never be cleared by account logic. */
var D=null;try{D=JSON.parse(localStorage.getItem('sb')||'null')}catch(e){}
D=D||{shop:'Ashirwad Tiles',items:[],parties:[],bills:[],pays:[],seq:1};
function save(){try{localStorage.setItem('sb',JSON.stringify(D))}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(n){return '₹'+(Math.round(n*100)/100).toLocaleString('en-IN')}
function dt(i){return new Date(i).toLocaleDateString('en-IN')}
function P(id){return D.parties.find(function(p){return p.id===id})}
function I(id){return D.items.find(function(p){return p.id===id})}
function bal(p){var b=+p.open||0;D.bills.forEach(function(x){if(x.pid===p.id)b+=x.total});D.pays.forEach(function(x){if(x.pid===p.id)b-=x.amt});return b}
function balTxt(b){return b>0?'<span class="red">'+money(b)+' to receive</span>':b<0?'<span class="grn">'+money(-b)+' advance</span>':'<span class="mu">Nil</span>'}
var tab='home',draft={pid:'',lines:[]},last=null,openP=null,openB=null;
var viewB=null;
function go(t){tab=t;openP=null;openB=null;viewB=null;lastDisp=null;openI=null;render()}
function rename(){var n=prompt('Shop name',D.shop);if(n){D.shop=n;save();render()}}
function render(){
 $('#sh').textContent=D.shop;
 ['home','bill','stock','party','tx','rep','bk'].forEach(function(t){$('#t-'+t).classList.toggle('on',tab===t)});
 $('#v').innerHTML=tab==='home'?vHome():tab==='bill'?(openB?vDispatch():viewB?vBillView():vBill2()):tab==='stock'?vStock():tab==='party'?'<div class="split"><div class="'+(openP?'hid':'')+'">'+vParty()+'</div><div>'+(openP?vLedger():'<div class="card mu">Click a party to see its ledger</div>')+'</div></div>':tab==='rep'?vRep():tab==='tx'?vTx():vBk();
}
/* ---------- BILL ---------- */
function vBill(){
 var h='';
 if(last){var b=D.bills.find(function(x){return x.no===last});if(b)h+='<div class="ok">Bill #'+b.no+' saved. <button class="b" onclick="wa('+b.no+')">Send on WhatsApp</button></div>'}
 if(!D.parties.length||!D.items.length)return h+'<div class="card">First add at least one party (Parties tab) and one item (Stock tab).</div>';
 h+='<div class="card"><b>New bill</b><select onchange="draft.pid=this.value"><option value="">Select party</option>'+D.parties.map(function(p){return '<option value="'+p.id+'"'+(draft.pid===p.id?' selected':'')+'>'+esc(p.name)+'</option>'}).join('')+'</select>';
 h+='<select id="bi" onchange="var i=I(this.value);$(\'#br\').value=i?i.rate:\'\'"><option value="">Select item</option>'+D.items.map(function(i){return '<option value="'+i.id+'">'+esc(i.name)+' ('+i.qty+' '+esc(i.unit)+')</option>'}).join('')+'</select>';
 h+='<div class="g"><input id="bq" type="number" inputmode="decimal" placeholder="Qty"><input id="br" type="number" inputmode="decimal" placeholder="Rate"></div><button class="s" onclick="addLine()">+ Add item</button>';
 var tot=0;
 draft.lines.forEach(function(l,k){tot+=l.amt;h+='<div class="row" style="margin-top:6px"><span>'+esc(l.name)+'<br><span class="mu">'+l.qty+' × '+l.rate+'</span></span><span>'+money(l.amt)+' <button class="s" onclick="draft.lines.splice('+k+',1);render()">✕</button></span></div>'});
 if(draft.lines.length){h+='<div class="row" style="margin-top:8px"><b>Total</b><b>'+money(tot)+'</b></div><input id="bp" type="number" inputmode="decimal" placeholder="Paid now (optional)"><button class="b" style="width:100%;margin-top:6px" onclick="saveBill()">Save bill</button>'}
 h+='</div><h2>Recent bills</h2>';
 D.bills.slice(-15).reverse().forEach(function(b){var p=P(b.pid);h+='<div class="card row"><span style="cursor:pointer" onclick="viewB='+b.no+';render()">#'+b.no+' '+esc(p?p.name:'?')+'<br><span class="mu">'+dt(b.date)+pend(b)+'</span></span><span>'+money(b.total)+'<br><button class="s" onclick="openB='+b.no+';render()">Dispatch</button> <button class="s" onclick="wa('+b.no+')">WhatsApp</button></span></div>'});
 return h;
}
function addLine(){
 var i=I($('#bi').value),q=+$('#bq').value,r=+$('#br').value;
 if(!i||!(q>0)||!(r>=0)||$('#br').value==='')return alert('Select item and enter qty and rate');
 if(q>i.qty&&!confirm('Only '+i.qty+' '+i.unit+' in stock. Add anyway?'))return;
 draft.lines.push({iid:i.id,name:i.name,unit:i.unit,qty:q,rate:r,amt:q*r,nowq:Math.min(+(($('#bs')||{}).value)||0,q)});render();
}
function saveBill(){
 if(!draft.pid)return alert('Select a party');
 var paid=+($('#bp').value||0),total=draft.lines.reduce(function(a,l){return a+l.amt},0),no=D.seq++;
 draft.lines.forEach(function(l){var i=I(l.iid);if(i)i.qty=Math.round((i.qty-l.qty)*100)/100});
 D.bills.push({no:no,pid:draft.pid,date:Date.now(),lines:draft.lines,total:total,paid:paid});
 if(paid>0)D.pays.push({id:uid(),pid:draft.pid,date:Date.now(),amt:paid,note:'With bill #'+no});
 save();last=no;draft={pid:'',lines:[]};render();
}
function phone(p){var d=String(p.phone||'').replace(/\D/g,'');return d.length===10?'91'+d:d}
function openWA(p,text){if(!phone(p))return alert('Add a phone number for this party first');window.open('https://wa.me/'+phone(p)+'?text='+encodeURIComponent(text),'_blank')}
function wa(no){
 var b=D.bills.find(function(x){return x.no===no}),p=P(b.pid);if(!p)return;
 var t='Namaste '+p.name+',\nBill #'+b.no+' ('+dt(b.date)+') from '+D.shop+'\n\n';
 b.lines.forEach(function(l){t+=l.name+': '+l.qty+' '+l.unit+' × '+l.rate+' = '+money(l.amt)+'\n'});
 t+='\nBill total: '+money(b.total);
 if(b.paid>0)t+='\nPaid: '+money(b.paid);
 var bl=bal(p);t+='\nTotal pending balance: '+money(bl>0?bl:0)+'\n\nThank you!';
 openWA(p,t);
}
/* ---------- BILL v2: type party and items directly ---------- */
function vBill2(){
 var h='';

  isCmd=function(q){return !!localIntent(q)||_baseIs(q)};
  strongCmd=function(q){var j=localIntent(q);if(j)return true;return _baseStrong(q)};
  /* Important: even when an online AI provider is selected, obvious daily Hindi transactions
     are parsed locally first so AI can never misclassify "maal vapsi" as payment received. */
  parseCmd=function(q,force){
    var j=localIntent(q,force);
    if(j)return clarify(j,force).then(function(x){return mkConf(x,force)});
    return _baseParse(q,force);
  };
  OWNHELP='Natural Hindi/Hinglish examples:\n• "Raju ka maal vapsi aaya hai" → Sale Return\n• "Maal vapsi aaya hai Raju ka" → Sale Return\n• "Raju ke 5000 rupaye aaye hain" → Payment In\n• "Raju ko 2000 rupaye diye" → Payment Out';
})();


/* ================= HARD DAILY HINDI ROUTER v10 =================
   This is deliberately independent of the older parsers. It runs first and
   recognises shop-style word order such as "Raju ka maal vapsi aaya hai". */
(function(){
  var prevParse=parseCmd, prevOwn=ownParse, prevIs=isCmd;
  function H(q){
    return String(q||'').toLowerCase()
      .replace(/[।!?.,]/g,' ')
      .replace(/\s+/g,' ').trim();
  }
  function retWords(z){
    return /(?:^|\s)(?:vapsi|vapsi|wapasi|wapas|vapas|vaapsi|return|laut|lauta|lautaya|lautaya)(?:\s|$)|वापसी|वापस|लौटा|लौटाया/.test(z);
  }
  function goodsWords(z){return /(?:^|\s)(?:maal|mal|samaan|saman)(?:\s|$)|माल|सामान/.test(z)}
  function exactPartyFromSpeech(z){
    var clean=H(z), exact=[];
    D.parties.forEach(function(p){
      var n=H(p.name);
      if(!n)return;
      if(clean.indexOf(n)>=0)exact.push(p);
    });
    if(exact.length===1)return exact[0].name;
    /* Prefer an exact spoken token that exactly equals a party's first word,
       but do NOT silently select a longer party when several are possible. */
    var ws=clean.split(/\s+/), cand='';
    for(var i=0;i<ws.length;i++){
      if(/^(ka|ki|ke|ko|se|ne|का|की|के|को|से|ने)$/.test(ws[i])){
        if(i>0)cand=ws[i-1];
        else if(i+1<ws.length)cand=ws[i+1];
      }
    }
    if(!cand){
      for(var j=0;j<ws.length;j++){
        if(!/^(maal|mal|samaan|saman|vapsi|vapsi|wapasi|wapas|vapas|vaapsi|aaya|aaye|aayi|aya|aye|ayi|hai|hain|ka|ki|ke|ko|se|ne|rupaye|rupees|rs)$/.test(ws[j])&&!/^\d/.test(ws[j])){cand=ws[j];break;}
      }
    }
    if(!cand)return '';
    var hits=D.parties.filter(function(p){return H(p.name)===cand});
    if(hits.length===1)return hits[0].name;
    return cand;
  }
  function hardIntent(q,force){
    if(force)return null;
    var z=H(q);
    /* CRITICAL RULE: maal/samaan + any return word ALWAYS wins over aaya/aaye. */
    if(goodsWords(z)&&retWords(z)){
      var party=exactPartyFromSpeech(z), item='', qty=0, unit='';
      D.items.forEach(function(it){var n=H(it.name);if(n&&z.indexOf(n)>=0&&n.length>item.length)item=it.name});
      var tt=owTok(z);
      for(var i=0;i<tt.length-1;i++){
        if(tt[i].n!==undefined&&tt[i+1]&&tt[i+1].w&&W_UNIT[tt[i+1].w]){qty=+tt[i].n;unit=tt[i+1].w;break;}
      }
      var pur=/\b(supplier|vendor|saplaier|purchase|kharid|kharidi)\b|सप्लायर|खरीद/.test(z);
      return {action:pur?'purchase_return':'sale_return',party:party,items:[{name:item,qty:qty,unit:unit,rate:0}],paid:0,amount:0,note:'',mk:1,_hardHindi:1};
    }
    /* Payment language only applies when there is a numeric amount. */
    var amount=0, tok=owTok(z);
    for(var k=0;k<tok.length;k++)if(tok[k].n!==undefined&&+tok[k].n>0){amount=+tok[k].n;break;}
    if(amount>0){
      var party2=exactPartyFromSpeech(z);
      if(/\b(diya|diye|de diya|de diye|bheja|bheje|paid)\b|दिया|दिए|भेजा/.test(z))
        return {action:'payment_out',party:party2,items:[],paid:0,amount:amount,note:'',mk:1,_hardHindi:1};
      if(/\b(aaya|aaye|aayi|aya|aye|ayi|mila|mile|mili|jama|received)\b|आया|आए|आई|मिला|मिले|मिली|जमा/.test(z))
        return {action:'payment_in',party:party2,items:[],paid:0,amount:amount,note:'',mk:1,_hardHindi:1};
    }
    return null;
  }
  ownParse=function(q,force){return hardIntent(q,force)||prevOwn(q,force)};
  isCmd=function(q){return !!hardIntent(q)||prevIs(q)};
  parseCmd=function(q,force){
    var j=hardIntent(q,force);
    if(j)return clarify(j,force).then(function(x){return mkConf(x,force)});
    return prevParse(q,force);
  };
  /* expose for testing/debugging without changing UI */
  window.__offlineHindiIntent=hardIntent;
})();


/* ================= SMART MATCHER v13: NEVER GUESS SAVED PARTY OR ITEM =================
   Gemini understands the words; the local app alone matches them to records.
   Exact/unique match -> automatic. Multiple/uncertain -> owner MUST choose. */
(function(){
  var _clarifyStrict=clarify, _baseResolveName=resolveName;
  function exactWords(s){return String(s||'').toLowerCase().trim().replace(/\s+/g,' ')}
  /* Guard against AI returning an expanded saved name when only a shorter spoken name was supplied.
     The parser prompt already forbids expansion; this layer keeps matching conservative. */
  function strictResolve(list,spoken){
    spoken=String(spoken||'').trim();
    if(!spoken)return {k:'none',hit:[]};
    var n=nz(spoken), words=qWords(spoken);
    var exact=list.filter(function(o){return nz(o.name)===n});
    if(exact.length===1)return {k:'exact',hit:exact};
    /* For one short spoken word, every record starting with that word is a candidate.
       Never silently choose one of them. */
    var tokenHits=list.filter(function(o){
      var w=qWords(o.name);
      if(words.length===1)return w.some(function(x){return x===words[0] || x.indexOf(words[0])===0 || psim(x,words[0])>=.82});
      return words.every(function(t){return w.some(function(x){return x===t || x.indexOf(t)===0 || psim(x,t)>=.80})});
    });
    if(tokenHits.length===1)return {k:'one',hit:tokenHits};
    if(tokenHits.length>1)return {k:'many',hit:tokenHits};
    return _baseResolveName(list,spoken);
  }
  clarify=async function(j,force){
    /* Re-run the normal clarification after making its name resolver conservative. */
    var oldResolve=resolveName;
    resolveName=function(list,spoken){return strictResolve(list,spoken)};
    try{return await _clarifyStrict(j,force)}finally{resolveName=oldResolve}
  };
})();



/* ================= MULTI-ITEM VOICE v14 =================
   One transaction can contain many spoken line items. Gemini extracts all items
   from one sentence; while the confirmation is open, the "Speak more details"
   mic adds further items to the same transaction instead of replacing earlier ones. */
PSYS += '\nMULTI-ITEM TRANSACTIONS: A single sale, purchase, return, estimate, order or challan may contain ANY number of items. If the owner says multiple items in one sentence, return EVERY item in the items array, in the spoken order. Examples: "Raju ka bill bana do 10 bori cement aur 20 box tiles" must return two items. Words such as aur, bhi, plus, phir, and, aur ek, also usually mean another line item. During an already-open transaction, treat the new speech as ADDITIONAL details/items for the same action; do not replace earlier items. Example after cement is already present: "20 box tiles bhi" returns only the new tiles line, so the app can append it. Never invent omitted quantity, rate, unit, party or item.\n';

(function(){
  var _oldMergeMulti=vmerge;
  vmerge=function(c,n){
    if(!n)return;
    /* Never allow a later short item command to wipe the chosen party. */
    var oldParty=c.p;
    _oldMergeMulti(c,n);
    if(!n.p&&oldParty)c.p=oldParty;

    /* Merge duplicate exact lines only when the spoken addition is clearly the same item,
       otherwise keep every line as a separate editable line. */
    if(c&&Array.isArray(c.rows)){
      var out=[];
      c.rows.forEach(function(r){
        if(!r||( !(String(r.n||'').trim()) && !(+r.q>0)))return;
        var key=nz(r.n)+'|'+nz(r.u)+'|'+(+r.r||0);
        var found=null;
        for(var i=0;i<out.length;i++){
          var k2=nz(out[i].n)+'|'+nz(out[i].u)+'|'+(+out[i].r||0);
          if(key&&key===k2){found=out[i];break}
        }
        if(found)found.q=(+found.q||0)+(+r.q||0);
        else out.push(r);
      });
      c.rows=out;
    }
  };

  /* Make the follow-up voice hint explicitly teach multi-item additions. */
  var _oldConfHtmlMulti=confHtml;
  confHtml=function(v){
    var h=_oldConfHtmlMulti(v);
    if(v&&v.conf&&!(v.conf.a||'').match(/^payment/)){
      h=h.replace('Tap the mic and say more details, for example: &ldquo;Ramesh, 10 bag cement&rdquo;',
        'Tap the mic to add more items: &ldquo;20 box tiles bhi&rdquo; or &ldquo;aur 5 basin&rdquo;. Each new item is added to this same transaction.');
    }
    return h;
  };
})();
})();

</script>

<script id="message-template-module">

    dispatchCustomer:"🚚🎉 Good news, {{partyName}}!\n\nYour goods from {{businessName}} are on the way! 📦\n\n{{items}}\n\nPlease be ready to receive your goods. 😊\n\nThank you for choosing us! 🙏",
    dispatchTransporter:"🚚 DISPATCH DETAILS\n\nCustomer: {{partyName}}\n📞 Contact: {{phone}}\n📍 Address: {{address}}\n\n📦 Goods to deliver:\n{{items}}\n\nPlease deliver the above goods safely and update us after delivery. 🙏\n\n{{businessName}}"
  };
  var MSG_TYPES=[
    ['sale','🧾 Sale'],['paymentIn','💰 Payment In'],['paymentOut','💸 Payment Out'],
    ['reminder','🔔 Reminder'],['saleReturn','↩️ Sale Return'],['purchase','🛒 Purchase'],
    ['dispatchCustomer','🚚 Dispatch Customer'],['dispatchTransporter','🚛 Dispatch Transporter']
  ];

  function store(){D.msgTemplates=D.msgTemplates||{};return D.msgTemplates}
  function getTpl(k){var v=store()[k];return typeof v==='string'&&v.trim()?v:MSG_DEFAULTS[k]}
  function fillTpl(k,data){
    var t=getTpl(k);
    Object.keys(data||{}).forEach(function(key){
      var value=data[key]==null?'':String(data[key]);
      t=t.split('{{'+key+'}}').join(value);
    });
    return t;
  }
  function linesText(lines){
    return (lines||[]).map(function(l){
      return '• '+(l.name||'')+': '+(l.qty!=null?l.qty:(l.q!=null?l.q:''))+' '+(l.unit||'');
    }).join('\n');
  }
  window.msgFill=fillTpl;

  var oldSettings=vSettings;
  vSettings=function(){
    if(sTab==='msg')return msgSettingsHome();
    var html=oldSettings();
    var marker='</div><div class="card"';

    if(at>=0){
      var active='background:#1a73e8;color:#fff';
      var button='<button class="s" style="'+(sTab==='msg'?active:'')+'" onclick="sTab=\'msg\';render()">💬 Messages</button>';
      html=html.slice(0,at)+button+html.slice(at);
    }
    return html;
  };

  function msgSettingsHome(){
    var tabs=MSG_TYPES.map(function(x){
      return '<button class="s" onclick="msgEdit(\''+x[0]+'\')">'+x[1]+'</button>';
    }).join('');
    return '<h2 style="font-size:20px;margin:6px 0">Settings · Messages</h2>'+
      '<div class="pills" style="display:flex"><button class="s" onclick="sTab=\'gen\';render()">General</button><button class="s" style="background:#1a73e8;color:#fff">💬 Messages</button></div>'+
      '<div class="card msg-editor"><b>Custom transaction messages</b><p class="mu">Create and save a different WhatsApp message for each transaction. The message text is the same data on all devices; only the Settings layout changes automatically for phone and desktop.</p>'+
      '<div class="msgtabs">'+tabs+'</div>'+
      '<p class="mu">Choose a message type to edit it.</p></div>'+
      '<div class="card msg-editor"><b>📢 Send an offer to customers</b><p class="mu">Send an offer (with a photo if you like) to all your parties or only the ones you choose, one by one, slowly. The app remembers who already got it.</p><button class="b" onclick="sTab=\'promo\';render()">Open</button></div>';
  }

  window.msgEdit=function(k){

        '{{total}}','{{paid}}','{{balance}}','{{amount}}','{{transactionType}}',
        '{{transporterName}}','{{phone}}','{{address}}'
      ].map(function(x){return '<span class="msg-field">'+x+'</span>'}).join('')+'</div>'+
      '<div class="msg-actions"><button class="b" onclick="msgSave(\''+k+'\')">Save</button>'+
      '<button class="s" onclick="msgRestore(\''+k+'\')">Default</button>'+
      '<button class="s" onclick="msgPreview(\''+k+'\')">Preview</button></div></div>';
    $('#v').innerHTML=html;
    window.scrollTo(0,0);
  };

  window.msgSave=function(k){
    var e=$('#msg_tpl');if(!e)return;
    store()[k]=e.value;save();alert('Message template saved ✓');
  };
  window.msgRestore=function(k){

    store()[k]=MSG_DEFAULTS[k];save();msgEdit(k);
  };
  window.msgPreview=function(k){
    var e=$('#msg_tpl'),t=e?e.value:getTpl(k);
    var demo={partyName:'Raju',businessName:D.shop||'Your Shop',invoiceNo:'101',date:'Today',

      amount:'5,000',transactionType:'Transaction',transporterName:'ABC Transport',
      phone:'9876543210',address:'Customer Address'};

  var oldWa=wa;

  docWA=function(id){

    var key=d.t==='pur'||d.t==='pret'?'purchase':(d.t==='ret'?'saleReturn':'sale');

      items:linesText(d.lines),total:String(d.total),paid:'',balance:String(Math.max(bal(p),0)),
      amount:String(d.total),transactionType:(DT[d.t]&&DT[d.t].s)||'Transaction'
    }));
  };

  var oldPayWA=payWA;
  payWA=function(id){
    var x=D.pays.find(function(q){return q.id===id}),p=x&&P(x.pid);
    if(!x||!p)return oldPayWA(id);
    var key=x.ret?'saleReturn':(x.out?'paymentOut':'paymentIn');
    openWA(p,fillTpl(key,{
      partyName:p.name,businessName:D.shop,amount:String(x.amt),
      balance:String(Math.max(bal(p),0)),items:linesText(x.lines||[])
    }));
  };

  var oldWaRem=waRem;
  waRem=function(no,now){
    var b=bl(no),p=b&&P(b.pid);if(!b||!p)return oldWaRem(no,now);
    var items=[];
    if(now&&lastDisp&&lastDisp.no===no)items=lastDisp.items.map(function(x){return {name:x.name,qty:x.q,unit:x.unit}});
    else items=b.lines.filter(function(l){return dq(l)>0}).map(function(l){return {name:l.name,qty:dq(l),unit:l.unit}});
    openWA(p,fillTpl('dispatchCustomer',{
      partyName:p.name,businessName:D.shop,invoiceNo:b.no,items:linesText(items),
      transporterName:'',phone:p.phone||'',address:''
    }));
  };
})();

<script id="promo-module">

(function(){
 var PR={cur:null,tab:'setup',q:'',f:'all',own:false,busy:false,lk:[]};

 var STOPLINE='\n\nTo stop offers reply STOP / ऑफर बंद करने के लिए STOP लिखें';
 var SQL="alter table outbox add column if not exists send_after timestamptz;\n"+
  "alter table outbox add column if not exists media_url text;\n"+
  "alter table outbox add column if not exists campaign text;\n"+
  "insert into storage.buckets (id,name,public) values ('promo','promo',true) on conflict (id) do nothing;\n"+
  "drop policy if exists \"promo upload\" on storage.objects;\n"+
  "create policy \"promo upload\" on storage.objects for insert to anon, authenticated with check (bucket_id='promo');\n"+
  "drop policy if exists \"promo read\" on storage.objects;\n"+
  "create policy \"promo read\" on storage.objects for select to anon, authenticated using (bucket_id='promo');\n"+
  "drop policy if exists \"promo delete\" on storage.objects;\n"+
  "create policy \"promo delete\" on storage.objects for delete to anon, authenticated using (bucket_id='promo');";
 var SPEED={
  safe:{min:30,max:60,batch:15,rest:10,cap:150,t:'Safe (best)',d:'Waits 30 to 60 seconds between messages. Takes a 10 minute break after every 15 messages. Sends at most 150 in one day.'},
  extra:{min:60,max:90,batch:10,rest:15,cap:100,t:'Extra safe',d:'Waits 60 to 90 seconds between messages. Takes a 15 minute break after every 10 messages. Sends at most 100 in one day. Slowest, but the safest.'},
  custom:{t:'My own',d:'Set the numbers yourself.'}};
 var SHOW=60;
 var FIELDS=['msg','stop','mode','sel','skip','bsize','speed','min','max','batch','rest','cap','from','to'];

 /* saving: wait a moment while typing, so the app stays fast */
 var ST=null;
 function psave(){clearTimeout(ST);ST=setTimeout(function(){ST=null;save()},400)}
 function flush(){if(ST){clearTimeout(ST);ST=null;save()}}
 window.addEventListener('pagehide',flush);
 document.addEventListener('visibilitychange',function(){if(document.hidden)flush()});

 function pp(){var p=PS();p.promo=p.promo||{};return p.promo}
 function CS(){var p=pp();p.camps=p.camps||{};return p.camps}
 function cc(){return PR.cur?(CS()[PR.cur]||null):null}
 function num(v,d){v=parseFloat(v);return isFinite(v)?v:d}
 function enc(k){return encodeURIComponent(k).replace(/'/g,'%27')}
 function dt(t){return new Date(t||Date.now()).toLocaleDateString('en-IN')}
 function cfg(){var x=cc()||{},sp=SPEED[x.speed]?x.speed:'safe',b=sp==='custom'?{min:num(x.min,30),max:num(x.max,60),batch:num(x.batch,15),rest:num(x.rest,10),cap:num(x.cap,150)}:SPEED[sp];
  return{speed:sp,min:b.min,max:b.max,batch:b.batch,rest:b.rest,cap:b.cap,from:num(x.from,10),to:num(x.to,20),stop:x.stop==null?1:+x.stop,msg:x.msg==null?DEFMSG:x.msg,name:x.name||'',skip:x.skip||{},sel:x.sel||{},mode:x.mode==='all'?'all':'pick',bsize:Math.max(0,Math.floor(num(x.bsize,0)))}}
 function sv(){return (cc()||{}).media||''}
 function sentMap(){return (cc()||{}).phones||{}}

 /* the old single "draft" (before campaigns) becomes a campaign once, so nothing is lost */
 function migrate(){
  var p=pp();if(!p.cname||!String(p.cname).trim())return;
  var nm=String(p.cname).trim(),k=nm.toLowerCase(),cs=CS(),x=cs[k];
  if(!x)x=cs[k]={name:nm,date:Date.now(),phones:{}};
  FIELDS.forEach(function(f){if(x[f]==null&&p[f]!=null)x[f]=p[f]});
  delete p.cname;FIELDS.forEach(function(f){delete p[f]});save()}

 var AU=null;
 function bust(){AU=null}
 function aud(){if(AU)return AU;var seen={},L=[];D.parties.forEach(function(p){if(p.x)return;var n=phone(p);if(n.length<10||seen[n])return;seen[n]=1;L.push(p)});
  AU=L.sort(function(a,b){return String(a.name).localeCompare(String(b.name))});return AU}
 function isSent(c,p){return !!sentMap()[phone(p)]}
 function isOn(c,p){return c.mode==='all'?!c.skip[p.id]:!!c.sel[p.id]}
 function elig(c){return aud().filter(function(p){return isOn(c,p)&&!isSent(c,p)})}
 function pick(c){var L=elig(c);return c.bsize>0?L.slice(0,c.bsize):L}
 function fill(t,p){return String(t).replace(/\{name\}/g,function(){return p?p.name:'Customer'}).replace(/\{shop\}/g,function(){return D.shop||''})}
 function plan(n,c,start,rnd){
  var mn=Math.max(1,c.min),mx=Math.max(mn,c.max),fr=c.from,to=c.to;if(!(fr>=0&&to<=24&&fr<to)){fr=0;to=24}
  var out=[],t=start,day=null,cnt=0,inb=0;
  function dawn(d){d.setHours(fr,Math.floor(rnd()*5),Math.floor(rnd()*60),0);return d.getTime()}
  for(var i=0;i<n;i++){
   var d=new Date(t);
   if(d.getHours()<fr)t=dawn(d);else if(d.getHours()>=to){d.setDate(d.getDate()+1);t=dawn(d)}
   var dk=new Date(t).toDateString();if(dk!==day){day=dk;cnt=0}
   if(c.cap>0&&cnt>=c.cap){var e=new Date(t);e.setDate(e.getDate()+1);t=dawn(e);day=new Date(t).toDateString();cnt=0}
   out.push(t);cnt++;inb++;
   t+=(mn+rnd()*(mx-mn))*1000;
   if(c.batch>0&&inb>=c.batch){inb=0;t+=c.rest*60000*(0.8+rnd()*0.4)}
  }
  return out}
 function dur(ms){var m=Math.max(1,Math.round(ms/60000));if(m<60)return m+' min';var h=Math.floor(m/60);if(h<36)return h+' hr '+(m%60)+' min';return Math.round(h/24)+' days'}
 function fmt(t){return new Date(t).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}
 function hl(h){h=+h;if(h===0||h===24)return '12 midnight';if(h===12)return '12 noon';return h<12?h+' AM':(h-12)+' PM'}
 function parties(n){return n+(n===1?' party':' parties')}

 function matches(c){var q=PR.q.toLowerCase().trim(),dq=q.replace(/\D/g,'');
  return aud().filter(function(p){
   var s=isSent(c,p);
   if(PR.f==='new'&&s)return false;if(PR.f==='sent'&&!s)return false;
   if(PR.f==='chosen'&&!(isOn(c,p)&&!s))return false;
   return !q||String(p.name).toLowerCase().indexOf(q)>=0||(dq&&phone(p).indexOf(dq)>=0)})}

 function goText(){var c=cfg(),n=pick(c).length,E=elig(c).length;return 'Send to '+parties(n)+(E>n?' (next group)':'')}
 function sumHtml(){
  var c=cfg(),all=aud(),E=elig(c),L=pick(c),n=L.length,skipped=all.filter(function(p){return isOn(c,p)&&isSent(c,p)}).length,h='';
  if(c.mode==='pick'&&!E.length)h+='<div class="pr-warn">No party is chosen yet. In Step 3, search a party and tap its box.</div>';
  h+='<div class="pr-box"><b>'+n+'</b> '+(n===1?'party':'parties')+' will get this message now.';
  if(n){h+='<div style="margin-top:8px"><b>Selected parties:</b><div class="pr-fl" style="margin-top:6px">'+L.map(function(p){return '<span class="pr-chip">'+esc(p.name)+'</span>'}).join('')+'</div></div>'}
  if(E.length>n)h+='<br>📦 <b>'+(E.length-n)+'</b> more are waiting for the next group. When this group is sent, press the send button again.';
  if(skipped)h+='<br>✓ <b>'+skipped+'</b> already got "'+esc(c.name)+'" earlier and will be skipped.';
  if(n){var t=plan(n,c,Date.now()+30000,function(){return .5}),last=t[n-1];h+='<br>This group takes about <b>'+dur(last-Date.now())+'</b>. Last message goes around <b>'+fmt(last)+'</b>.'}
  h+='</div>';
  if(!(c.from>=0&&c.to<=24&&c.from<c.to))h+='<div class="pr-warn">The start time must be earlier than the end time (Step 5). Until you fix it, messages can go at any time of the day.</div>';
  if(c.min<20)h+='<div class="pr-warn">⚠️ Less than 20 seconds wait is risky. WhatsApp can block the number.</div>';
  if(c.cap>200||c.cap<=0)h+='<div class="pr-warn">⚠️ More than about 200 messages a day is risky for the number.</div>';
  if(!/\{name\}/.test(c.msg))h+='<div class="pr-warn">Tip: add {name} in the message so each person sees their own name. The same text for everyone looks like spam.</div>';
  return h}
 function bubHtml(){var c=cfg(),p=pick(c)[0]||aud()[0],t=fill(c.msg,p)+(c.stop?STOPLINE:''),u=sv();
  return '<div class="pr-bub">'+(u?'<img src="'+esc(u)+'">':'')+esc(t)+'</div>'}

 function rowHtml(c,p){var s=isSent(c,p);
  return '<label><input type="checkbox" '+(s?'disabled ':(isOn(c,p)?'checked ':''))+'onchange="prTog(\''+p.id+'\',this.checked)"><span style="flex:1">'+esc(p.name)+'</span>'+(s?'<span class="pr-tag">✓ already sent</span>':'<span class="mu">'+esc(phone(p).slice(-10))+'</span>')+'</label>'}
 function listHtml(){var c=cfg(),M=matches(c);
  if(!M.length)return '<div class="mu" style="padding:10px">No party found.</div>';
  var h=M.slice(0,SHOW).map(function(p){return rowHtml(c,p)}).join('');
  if(M.length>SHOW)h+='<div class="mu" style="padding:10px">Showing '+SHOW+' of '+M.length+'. Type a name above to find the others.</div>';
  return h}
 function toolsHtml(){var c=cfg(),n=matches(c).length,pk=c.mode==='pick';
  return '<button class="s" onclick="prAll(true)">'+(pk?'Choose these '+n:'Tick these '+n)+'</button><button class="s" onclick="prAll(false)">'+(pk?'Remove these':'Untick these')+'</button>'}
 function selHtml(){var c=cfg();if(c.mode!=='pick')return '';
  var L=elig(c),h='<div class="pr-box"><b>'+L.length+'</b> '+(L.length===1?'party':'parties')+' chosen';
  if(L.length){h+=' <button class="s" style="margin-left:8px" onclick="prClear()">Remove all</button><div class="pr-fl" style="margin-top:8px">'+
   L.slice(0,40).map(function(p){return '<span class="pr-chip">'+esc(p.name)+' <a onclick="prRem(\''+p.id+'\')">✕</a></span>'}).join('')+
   (L.length>40?'<span class="mu">+ '+(L.length-40)+' more</span>':'')+'</div>'}
  else h+='<div class="mu" style="margin-top:4px">Search a party below and tap its box to choose it.</div>';
  return h+'</div>'}
 function whoHtml(){var c=cfg(),pk=c.mode==='pick';
  return '<div class="pr-h"><span class="pr-n">3</span>Who gets it</div>'+
   '<div class="pr-mode"><button class="s'+(pk?' on':'')+'" onclick="prMode(\'pick\')">Only parties I choose</button><button class="s'+(!pk?' on':'')+'" onclick="prMode(\'all\')">All parties</button></div>'+
   '<div class="mu">'+(pk?'Search a party, tap its box. You can search again and choose more. Your choice stays saved in this campaign.':'Everyone gets the message. Untick the ones you want to skip.')+'</div>'+
   '<div id="pr_sel">'+selHtml()+'</div>'+
   '<input class="pr-srch" placeholder="🔍 Search party name or number" value="'+esc(PR.q)+'" oninput="prFind(this.value)">'+
   '<div class="pr-fl">'+[['all','All'],['new','Not sent yet'],['sent','Already sent']].concat(pk?[['chosen','Chosen']]:[]).map(function(f){return '<button class="s'+(PR.f===f[0]?' on':'')+'" onclick="prFilt(\''+f[0]+'\')">'+f[1]+'</button>'}).join('')+'</div>'+
   '<div id="pr_tools" class="pr-fl">'+toolsHtml()+'</div>'+
   '<div id="pr_list" class="pr-list">'+listHtml()+'</div>'}
 function batchHtml(){var c=cfg(),E=elig(c).length,pre=[25,50,100],own=PR.own||(c.bsize>0&&pre.indexOf(c.bsize)<0);
  var b=[[0,'All together']].concat(pre.map(function(v){return [v,String(v)]}));
  return '<div class="pr-h"><span class="pr-n">4</span>How many at one time</div>'+
   '<div class="mu">You can send in small groups. Pick how many parties get the message each time you press Send.</div>'+
   '<div class="pr-sp">'+b.map(function(o){return '<button class="s'+(!own&&c.bsize===o[0]?' on':'')+'" onclick="prBatch('+o[0]+')">'+o[1]+'</button>'}).join('')+'<button class="s'+(own?' on':'')+'" onclick="prBatch(\'own\')">My own number</button></div>'+
   (own?'<div class="pr-g">'+numIn('bsize','Parties in one group',c.bsize||'')+'</div>':'')+
   '<div class="mu">'+(c.bsize>0?'Each time you press Send, the next '+c.bsize+' parties get it. The app remembers who already got it. So later, come back and press Send again for the next group.':'Everyone you chose gets the message in one go.')+' Waiting now: <b>'+E+'</b>.</div>'}
 function speedHtml(){var c=cfg();
  return '<div class="pr-h"><span class="pr-n">5</span>Speed and time</div><div class="mu">Slower is safer for your WhatsApp number.</div>'+
   '<div class="pr-sp">'+['safe','extra','custom'].map(function(k){return '<button class="s'+(c.speed===k?' on':'')+'" onclick="prSpeed(\''+k+'\')">'+SPEED[k].t+'</button>'}).join('')+'</div>'+
   '<div class="mu">'+SPEED[c.speed].d+'</div>'+
   (c.speed==='custom'?'<div class="pr-g">'+numIn('min','Wait between messages: from (seconds)',c.min)+numIn('max','Wait up to (seconds)',c.max)+'</div><div class="pr-g">'+numIn('batch','Take a break after every (messages)',c.batch)+numIn('rest','Break length (minutes)',c.rest)+'</div><div class="pr-g">'+numIn('cap','Most messages in one day',c.cap)+'</div>':'')+
   '<div class="mu" style="margin-top:10px"><b>Time of day.</b> Messages go only between these two times. Outside this time the app waits, and sends later.</div>'+
   '<div class="pr-g"><div><label class="mu">From</label>'+hourSel('from',c.from,1)+'</div><div><label class="mu">Until</label>'+hourSel('to',c.to,0)+'</div></div>'}
 function hourSel(k,v,isFrom){var o='';for(var h=isFrom?0:1;h<=(isFrom?23:24);h++)o+='<option value="'+h+'"'+(h===v?' selected':'')+'>'+hl(h)+'</option>';return '<select onchange="prSet(\''+k+'\',this.value)">'+o+'</select>'}
 function numIn(k,lb,v){return '<div><label class="mu">'+lb+'</label><input type="number" inputmode="numeric" value="'+v+'" oninput="prSet(\''+k+'\',this.value)"></div>'}
 function photoHtml(){var u=sv();
  return '<div class="pr-h"><span class="pr-n">2</span>Photo (optional)</div>'+
   '<div class="mu">The photo is saved the moment you choose it. It stays in this campaign, even if you close the app, until you end the campaign.</div>'+
   '<input id="pr_file" type="file" accept="image/*" onchange="prImg(this)" style="margin-top:6px"><div id="pr_imst" class="mu"></div>'+
   (u?'<div style="margin:8px 0"><img src="'+esc(u)+'" style="max-width:220px;max-height:220px;border-radius:8px;display:block"><span class="pr-tag" style="display:inline-block;margin-top:6px">✓ Photo saved</span></div><button class="s" onclick="prNoImg()">Remove photo</button>':'')}
 function setupHtml(){return '<details class="card pr-step"><summary><b>One-time setup (do this once)</b></summary><div class="mu" style="margin-top:6px">Needed for the photo, the timing and the record. Press Copy, open Supabase &gt; SQL Editor, paste, press Run. It is safe to run again.</div><button class="s" style="margin-top:6px" onclick="prCopySql()">Copy setup text</button></details>'}

 function paint(){var a=$('#pr_sum'),b=$('#pr_bub'),g=$('#pr_go');if(a)a.innerHTML=sumHtml();if(b)b.innerHTML=bubHtml();if(g&&!PR.busy)g.textContent=goText()}
 function paintSel(){var a=$('#pr_sel');if(a)a.innerHTML=selHtml()}
 function paintList(){var a=$('#pr_list'),t=$('#pr_tools');if(a)a.innerHTML=listHtml();if(t)t.innerHTML=toolsHtml();paintSel();paint()}
 function paintWho(){var a=$('#pr_who');if(a)a.innerHTML=whoHtml();paint()}
 function paintBatch(){var a=$('#pr_batch');if(a)a.innerHTML=batchHtml();paint()}
 function paintSpeed(){var a=$('#pr_speed');if(a)a.innerHTML=speedHtml();paint()}
 function paintPhoto(){var a=$('#pr_photo');if(a)a.innerHTML=photoHtml()}
 function paintAll(){bust();paintWho();paintBatch();paintPhoto();paint()}

 /* ---- settings of the open campaign (saved inside the campaign) ---- */
 function X(){var x=cc();return x&&!x.ended?x:null}
 window.prSet=function(k,v){var x=X();if(!x)return;x[k]=(k==='msg')?v:num(v,0);psave();paint()};
 window.prTog=function(id,on){var x=X();if(!x)return;if(cfg().mode==='all'){x.skip=x.skip||{};if(on)delete x.skip[id];else x.skip[id]=1}else{x.sel=x.sel||{};if(on)x.sel[id]=1;else delete x.sel[id]}psave();paintSel();paint();var b=$('#pr_batch');if(b)b.innerHTML=batchHtml()};
 window.prRem=function(id){var x=X();if(!x)return;x.sel=x.sel||{};delete x.sel[id];psave();paintList();paintBatch()};
 window.prClear=function(){var x=X();if(!x)return;var n=elig(cfg()).length;if(!n)return;if(!confirm('Remove all '+n+' chosen parties?'))return;x.sel={};psave();paintList();paintBatch()};
 window.prAll=function(on){var x=X();if(!x)return;var cf=cfg(),M=matches(cf);
  if(on&&M.length>50&&!confirm((cf.mode==='pick'?'Choose':'Tick')+' all '+M.length+' parties shown?'))return;
  if(cf.mode==='all'){x.skip=x.skip||{};M.forEach(function(p){if(on)delete x.skip[p.id];else x.skip[p.id]=1})}
  else{x.sel=x.sel||{};M.forEach(function(p){if(isSent(cf,p))return;if(on)x.sel[p.id]=1;else delete x.sel[p.id]})}
  psave();paintList();paintBatch()};
 window.prMode=function(m){var x=X();if(!x)return;x.mode=m;if(m==='all'&&PR.f==='chosen')PR.f='all';psave();paintWho();paintBatch()};
 window.prFind=function(v){PR.q=v||'';var a=$('#pr_list'),t=$('#pr_tools');if(a)a.innerHTML=listHtml();if(t)t.innerHTML=toolsHtml()};
 window.prFilt=function(f){PR.f=f;paintWho()};
 window.prStop=function(on){var x=X();if(!x)return;x.stop=on?1:0;psave();paint()};
 window.prBatch=function(v){var x=X();if(!x)return;var cur=cfg().bsize;if(v==='own'){PR.own=true;x.bsize=(cur>0&&[25,50,100].indexOf(cur)<0)?cur:10}else{PR.own=false;x.bsize=v}psave();paintBatch()};
 window.prSpeed=function(k){var x=X();if(!x)return;var cur=cfg();if(k==='custom'){x.min=cur.min;x.max=cur.max;x.batch=cur.batch;x.rest=cur.rest;x.cap=cur.cap}x.speed=k;psave();paintSpeed()};
 window.prCopySql=function(){function prt(){prompt('Copy this text:',SQL)}try{navigator.clipboard.writeText(SQL).then(function(){obToast('Copied. Now paste it in Supabase > SQL Editor and press Run')},prt)}catch(e){prt()}};

 /* ---- photo: uploaded and saved into the campaign the moment it is chosen ---- */
 window.prImg=function(inp){
  var x=X(),f=inp.files&&inp.files[0];if(!x||!f)return;if(!/^image\//.test(f.type))return alert('Please choose a photo');
  if(!obOk())return alert('The app is not connected to the cloud yet. Open the app again and try.');
  var st=$('#pr_imst');if(st)st.textContent='Saving photo...';
  var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
   var s=Math.min(1,1280/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);
   var g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.drawImage(im,0,0,cv.width,cv.height);
   cv.toBlob(function(b){
    var nm='camp-'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
    Promise.resolve(SB.storage.from('promo').upload(nm,b,{contentType:'image/jpeg'})).then(function(u){
     if(u&&u.error)throw new Error(u.error.message+' (is the one-time setup at the bottom done?)');
     var url=SB.storage.from('promo').getPublicUrl(u.data.path).data.publicUrl;
     if(x.media){x.trash=x.trash||[];x.trash.push(x.media)}
     x.media=url;x.last=Date.now();save();
     if(cc()===x){paintPhoto();paint()}
    }).catch(function(e){var s=$('#pr_imst');if(s)s.textContent='';alert('The photo could not be saved: '+((e&&e.message)||e))})
   },'image/jpeg',.82)};
   im.onerror=function(){var s=$('#pr_imst');if(s)s.textContent='';alert('Could not read this photo')};im.src=r.result};
  r.readAsDataURL(f)};
 window.prNoImg=function(){var x=X();if(!x||!x.media)return;x.trash=x.trash||[];x.trash.push(x.media);delete x.media;save();paintPhoto();paint()};

 /* ---- cloud helpers ---- */
 function fname(u){return decodeURIComponent(String(u||'').split('/promo/')[1]||'')}
 function pendN(k){return Promise.resolve(SB.from('outbox').select('id',{count:'exact',head:true}).eq('kind','promo').eq('campaign',k).in('status',['pending','sending'])).then(function(r){
  if(!r||r.error)throw new Error((r&&r.error&&r.error.message)||'no answer');return r.count||0})}
 function cancelPending(k){
  return Promise.resolve(SB.from('outbox').select('phone').eq('kind','promo').eq('campaign',k).eq('status','pending').limit(2000)).then(function(r){
   if(r&&r.error)throw r.error;var rows=(r&&r.data)||[];
   return Promise.resolve(SB.from('outbox').delete().eq('kind','promo').eq('campaign',k).eq('status','pending')).then(function(d){
    if(d&&d.error)throw d.error;var x=CS()[k];if(x&&x.phones)rows.forEach(function(m){delete x.phones[m.phone]});save();return rows.length})})}
 /* removes old photos (replaced ones, and the photo of ended campaigns) once nothing is waiting that uses them */
 function tidy(){
  if(typeof obOk!=='function'||!obOk())return;
  var cs=CS();Object.keys(cs).forEach(function(k){
   var x=cs[k],names=(x.trash||[]).slice();if(x.ended&&x.media)names.push(x.media);
   if(!names.length)return;
   pendN(k).then(function(n){
    if(n)return;var nm=names.map(fname).filter(Boolean);
    if(!nm.length){x.trash=[];if(x.ended)delete x.media;save();return}
    return Promise.resolve(SB.storage.from('promo').remove(nm)).then(function(r){
     if(r&&r.error)return;x.trash=[];if(x.ended)delete x.media;save()})
   }).catch(function(){})})}

 /* ---- waiting count, failed messages go back to "can send again" ---- */
 window.prPend=function(){
  var k=PR.cur;if(!k||!obOk())return;
  Promise.resolve(SB.from('outbox').select('id',{count:'exact',head:true}).eq('kind','promo').eq('campaign',k).eq('status','pending')).then(function(r){
   var e=$('#pr_pend');if(e)e.textContent=(r&&!r.error&&r.count!=null)?('Messages of this campaign waiting to be sent: '+r.count):''}).catch(function(){});

<script>
/* ---------- SELF-HEAL: cloud save recovers by itself (no refresh needed) ---------- */
(function(){

 function say(t){try{setMsg(t)}catch(e){}}

 function again(){
  if(retryT)return;

  retryT=setTimeout(function(){retryT=null;heal()},w)}
 function heal(){
  try{
   if(!window.SB||!DB||!synced)return;
   /* wake the login first (refreshes an expired token), then resend whatever failed */
   Promise.resolve(SB.auth.getSession()).then(function(r){
     if(r&&r.data&&r.data.session)return;
     return SB.auth.refreshSession()
   }).catch(function(){}).then(function(){
     if(!allOk())say('Cloud save paused. Retrying…');
     save();
     setTimeout(function(){if(!allOk())again()},8000)
   })
  }catch(e){again()}}
 /* a failed write no longer stays failed: keep it, retry it */
 fail=function(k){return function(e){
  if(e&&e.code==='invalid_argument'){delete SM[k];say('View-only account: not saved to cloud');return}
  failed[k]=1;delete SM[k];say('Cloud save paused. Retrying…');again()}};
 /* hook into the cloud object when sync starts */
 var _ss2=startSync;
 startSync=function(db){
  var d0=db.doc,c0=db.collection;
  db.doc=function(p){var o=d0(p),s0=o.set;
   o.set=function(d){return s0(d).then(function(r){delete failed[p];markOk();return r})};
   return o};
  db.collection=function(c){var o=c0(c),s0=o.onSnapshot;
   o.onSnapshot=function(cb,err){return s0(function(x){markOk();cb(x)},function(e){if(err)err(e);say('Cloud connection lost. Retrying…');again()})};
   return o};
  return _ss2(db)};
 /* wake-ups: laptop sleep, window brought back, internet returns */
 function wake(){if(window.sbLive)heal()}
 window.addEventListener('online',wake);
 window.addEventListener('focus',wake);
 document.addEventListener('visibilitychange',function(){if(!document.hidden)wake()});
 /* quiet watchdog: if anything is still unsaved, try again every minute */
 setInterval(function(){if(window.sbLive&&!document.hidden&&!allOk())heal()},60000);
})();

<script>
/* =====================================================================
   DESKTOP: every saved transaction opens in the SAME screen used to make it,
   locked (read only). Press Edit to change it. Payments are clickable.
   ===================================================================== */
(function(){
 var ROS={};           /* keys of saved items that are currently locked: b<no>, d<id>, p<id>, r<id> */
 var hold=0,_r0=render;
 var st=document.createElement('style');
 st.textContent='@media(min-width:900px){'+
  '.dkro input:disabled,.dkro textarea:disabled,.dkro select:disabled{color:#2d3350!important;-webkit-text-fill-color:#2d3350!important;opacity:1!important;cursor:default}'+
  '.dkro .tr,.dkro .pc,.dkro .ab,.dkro .ghost,.dkro a[onclick*="shipSame2"]{display:none!important}'+
  '.dkro .dkw{pointer-events:none}.dkro .dkg tr:hover>td.rn .no{display:inline-block!important}'+
  '.dkbn{margin:10px 24px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.dkbn .sp{flex:1}.dkbn .cx{color:#d93025;font-weight:700}'+
  '.dkf .ed{background:#1a73e8;color:#fff;border:0;padding:0 42px}.dkf .rs{background:#0f6e56;color:#fff;border:0;padding:0 42px}'+
  '}';
 document.head.appendChild(st);

 function curKey(){
  if(isM())return null;
  if(form&&draft&&draft.edit!=null&&document.querySelector('#v .dks'))return 'b'+draft.edit;
  if(sub==='doc'&&ddraft&&ddraft.edit)return 'd'+ddraft.edit;
  if(sub==='pin'&&pdraft&&pdraft.edit)return 'p'+pdraft.edit;
  if(sub==='ret'&&rdraft&&rdraft.edit)return 'r'+rdraft.edit;
  return null}
 function recOf(k){var id=k.slice(1);if(k[0]==='b')return bl(+id);if(k[0]==='d')return docById(id);return D.pays.find(function(q){return q.id===id})}
 function q(s){return "'"+String(s).replace(/'/g,"\\'")+"'"}

 /* ---------- open a saved item locked ---------- */
 function openBillRO(n){
  var b=bl(n);if(!b)return;viewB=null;
  var ti=-1;try{ti=DKT.findIndex(function(d){return d&&d.edit===n})}catch(e){}
  if(ti>=0){draft=DKT[ti];DKA=ti;form=true;tab='bill';last=null;return render()}
  ROS['b'+n]=1;
  var x=b.x;b.x=0;try{editBill(n)}finally{b.x=x}
  render()}
 function openDocRO(id){
  var d=docById(id);if(!d)return;viewD=null;ROS['d'+id]=1;
  var x=d.x;d.x=0;try{editDoc(id)}finally{d.x=x}
  render()}
 window.openPayRO=function(id){
  var x=D.pays.find(function(z){return z.id===id});if(!x||isM())return;
  var p=P(x.pid),z=dkDT(x.date);leave();
  if(x.ret){rdraft={edit:id,name:p?p.name:'',lines:JSON.parse(JSON.stringify(x.lines||[])),dt:z.dt,tm:z.tm};pg='sret';sub='ret';ROS['r'+id]=1}
  else{pdraft={edit:id,name:p?p.name:'',amt:x.amt,note:x.note||'',out:x.out?1:0,pt:x.pt||'Cash',dt:z.dt,tm:z.tm};pg=x.out?'pout':'pin';sub='pin';ROS['p'+id]=1}
  render()};

 /* ---------- render hook ---------- */
 render=function(){
  if(!isM()&&!hold){
   if(viewB&&!openB&&bl(viewB)){openBillRO(viewB);return}
   if(viewD&&docById(viewD)){openDocRO(viewD);return}
  }
  var r=_r0.apply(this,arguments);
  try{lockUI()}catch(e){try{console.error('lockUI',e)}catch(_){}}
  return r};
 var _se=saveEdit;saveEdit=function(){hold=1;try{return _se.apply(this,arguments)}finally{hold=0}};

 /* ---------- lock the screen after it is drawn ---------- */
 function lockUI(){
  var k=curKey();if(!k)return;var root=document.querySelector('#v .dks');if(!root)return;
  var rec=recOf(k);if(!rec)return;
  var kind=k[0],can=!!rec.x,ro=!!ROS[k]||can,id=k.slice(1);
  var h2=root.querySelector('.dkh h2');
  var label=kind==='b'?'Sale':kind==='d'?(DT[rec.t]||{}).s||'Document':kind==='r'?'Sale Return':(rec.out?'Payment-Out':'Payment-In');
  var no=kind==='b'?rec.no:kind==='d'?rec.no:'';
  var args=kind==='b'?String(rec.no):q(id);
  var fWA=kind==='b'?'wa('+args+')':kind==='d'?'docWA('+args+')':'payWA('+args+')';
  var fPr=kind==='b'?'printBill('+args+')':kind==='d'?'printDoc('+args+')':'rpPrintPay('+args+')';
  var fSh=kind==='b'?'shareBill('+args+')':fWA;
  var fDel=kind==='b'?'delBill('+args+')':kind==='d'?'delDoc('+args+')':'delPay('+args+')';
  var fCan=kind==='b'?'cancelBill('+args+')':kind==='d'?'cancelDoc('+args+')':'togPay('+args+')';
  var fRes=kind==='b'?'restoreBill('+args+')':kind==='d'?'restoreDoc('+args+')':'togPay('+args+')';
  var old=root.querySelector('.dkbn');if(old)old.remove();
  if(!ro){
   if(h2&&kind!=='b')h2.textContent=h2.textContent.replace(/^(Edit )?/,'Edit ');
   if(kind!=='b'){var bn0=document.createElement('div');bn0.className='ok dkbn';bn0.innerHTML='<span>Editing '+esc(label)+' '+(no?'#'+esc(no):'')+' - change anything and press <b>Save changes</b>.</span><span class="sp"></span><button class="s" onclick="dkDiscard()">Discard changes</button>';var hd0=root.querySelector('.dkh');hd0.parentNode.insertBefore(bn0,hd0.nextSibling);
    var sv=root.querySelector('.dkf .sv');if(sv&&!/changes/i.test(sv.textContent))sv.textContent='Save changes'}
   return}
  root.classList.add('dkro');
  if(h2)h2.textContent=h2.textContent.replace(/^Edit /,'');
  root.querySelectorAll('input,select,textarea').forEach(function(e){e.disabled=true});
  ['bi','dit','rit'].forEach(function(i){var e=document.getElementById(i);if(e){var tr=e.closest('tr');if(tr)tr.style.display='none'}});
  root.querySelectorAll('.ok').forEach(function(e){if(/^\s*Saved bill #/.test(e.textContent)&&!e.classList.contains('dkbn'))e.style.display='none'});
  var bn=document.createElement('div');bn.className='ok dkbn';
  bn.innerHTML='<span>'+esc(label)+(no?' #'+esc(no):'')+' &middot; '+dt(rec.date)+(can?' <span class="cx">(Cancelled)</span>':'')+' &middot; <span class="mu">Saved. Press <b>Edit</b> to change it.</span></span><span class="sp"></span>'+
   '<button class="s" onclick="'+fWA+'">WhatsApp</button>'+
   (can?'':'<button class="s" onclick="'+fCan+';render()">Cancel</button>')+
   '<button class="s" style="color:#d93025" onclick="'+fDel+'">Delete</button>'+
   '<button class="s" onclick="dkCloseRO()">Close</button>';
  var hd=root.querySelector('.dkh');hd.parentNode.insertBefore(bn,hd.nextSibling);
  var f=document.querySelector('#v .dkf');
  if(f)f.innerHTML='<button class="ic" title="Share" onclick="'+fSh+'">&#8599;</button><span class="pr"><button onclick="'+fPr+'">Print</button></span>'+
   (can?'<button class="rs" onclick="dkRestoreRO()">Restore</button>':'<button class="ed" onclick="dkEdit()">Edit</button>')}

 window.dkEdit=function(){var k=curKey();if(!k)return;delete ROS[k];render()};
 window.dkCloseRO=function(){
  var k=curKey();if(!k)return;
  if(k[0]==='b'){leaveForm();return}
  if(k[0]==='d')ddraft=null;sub=null;render()};
 window.dkRestoreRO=function(){
  var k=curKey();if(!k)return;var id=k.slice(1);
  if(k[0]==='b'){restoreBill(+id);try{DKT.forEach(function(d,i){if(d&&d.edit===+id){DKT.splice(i,1)}});DKA=-1}catch(e){}viewB=+id;form=false;render()}
  else if(k[0]==='d'){restoreDoc(id);openDocRO(id)}
  else{togPay(id);openPayRO(id)}};
 window.dkDiscard=function(){
  var k=curKey();if(!k)return;var id=k.slice(1);
  if(!confirm('Discard what you changed and show the saved version?'))return;
  if(k[0]==='d')openDocRO(id);else openPayRO(id)};

 /* ---------- Payment-In / Payment-Out / Sale Return rows are clickable ---------- */
 var _vPL=vPayList;
 vPayList=function(kk){
  var h=_vPL(kk);if(isM())return h;
  return h.replace(/<tr data-n="[^"]*">(?:(?!<\/tr>)[\s\S])*?<\/tr>/g,function(row){
   var m=row.match(/data-i="([^"]+)"/);
   return m?row.replace('<tr ','<tr style="cursor:pointer" onclick="openPayRO(\''+m[1]+'\')" '):row})};

 /* ---------- saving an edited payment / return ---------- */
 var _sp=savePin;
 savePin=function(){
  if(isM()||!pdraft||!pdraft.edit)return _sp.apply(this,arguments);
  var x=D.pays.find(function(z){return z.id===pdraft.edit});if(!x)return;
  var nm=(pdraft.name||'').trim(),a=+pdraft.amt;
  if(!nm)return alert('Enter party name');if(!(a>0))return alert('Enter the amount');
  var p=findP(nm);
  if(!p){if(!confirm('"'+nm+'" is not in your parties. Create new party?'))return;p={id:uid(),name:nm,phone:'',open:0};D.parties.push(p)}
  var s0=x.amt+'|'+(x.note||'')+'|'+x.pid;
  x.pid=p.id;x.amt=a;x.note=(pdraft.note||'').trim();x.pt=pdraft.pt||'Cash';
  var ts=dkTs(pdraft);if(ts)x.date=ts;
  save();var id=x.id,ch=s0!==(x.amt+'|'+(x.note||'')+'|'+x.pid);
  pdraft={name:'',amt:'',note:'',out:0};sub=null;
  try{if(ch&&awGo('upd',p)){_awUpd='pay';try{payWA(id)}finally{_awUpd=0}}}catch(e){}
  render()};
 var _sr=saveRet;
 saveRet=function(){
  if(isM()||!rdraft||!rdraft.edit)return _sr.apply(this,arguments);
  if(!dkRetFlush())return;
  var x=D.pays.find(function(z){return z.id===rdraft.edit});if(!x)return;
  var p=findP(rdraft.name);if(!p)return alert('Pick the customer from the list');
  if(!rdraft.lines.length)return alert('Add at least one item');
  if(!x.x)(x.lines||[]).forEach(function(l){var i=(l.iid&&I(l.iid))||findI(l.name);if(i)i.qty=rnd(i.qty-l.qty)});
  var tot=0;
  rdraft.lines.forEach(function(l){var i=findI(l.name);if(!i){i={id:uid(),name:l.name,unit:l.unit,rate:l.rate,qty:0,low:0};D.items.push(i)}l.iid=i.id;if(!x.x)i.qty=rnd(i.qty+l.qty);tot+=l.amt});
  x.pid=p.id;x.lines=rdraft.lines;x.amt=tot;var ts=dkTs(rdraft);if(ts)x.date=ts;
  save();rdraft={name:'',lines:[]};sub=null;render()};

 /* ---------- after delete, do not stay on a screen for a record that is gone ---------- */
 var _dp=delPay;delPay=function(id){var n=D.pays.length;_dp.apply(this,arguments);if(D.pays.length<n&&(sub==='pin'||sub==='ret')){sub=null}render()};
 var _dd=delDoc;delDoc=function(id){var n=D.docs.length;_dd.apply(this,arguments);if(D.docs.length<n){ddraft=null;if(sub==='doc')sub=null}render()};
})();
</script>
<script>
/* =====================================================================
   BACKUPS: offline copy on this computer every day (+ file), and email backup
   ===================================================================== */
(function(){
 var LS=function(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}};
 var today=function(){var d=new Date(),p=function(n){return (n<10?'0':'')+n};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
 var KEEP=30;
 /* --- tiny IndexedDB helper --- */
 function db(){return new Promise(function(res,rej){if(!window.indexedDB)return rej('no idb');var r=indexedDB.open('sbBackup',1);r.onupgradeneeded=function(){var d=r.result;if(!d.objectStoreNames.contains('snaps'))d.createObjectStore('snaps',{keyPath:'day'});if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv')};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
 function tx(store,mode,fn){return db().then(function(d){return new Promise(function(res,rej){var t=d.transaction(store,mode),s=t.objectStore(store),o=fn(s);t.oncomplete=function(){res(o&&o.result)};t.onerror=t.onabort=function(){rej(t.error)}})})}
 function kvGet(k){return tx('kv','readonly',function(s){return s.get(k)})}
 function kvSet(k,v){return tx('kv','readwrite',function(s){return s.put(v,k)})}
 function snapsAll(){return tx('snaps','readonly',function(s){return s.getAll()}).then(function(a){return (a||[]).sort(function(x,y){return x.day<y.day?1:-1})})}
 function full(){return JSON.stringify(D)}
 function hasData(){return D&&((D.bills||[]).length+(D.parties||[]).length+(D.items||[]).length)>0}
 function say(id,t){var e=document.getElementById(id);if(e)e.textContent=t}

 /* --- offline copy inside this browser (IndexedDB), one per day, last 30 kept --- */
 var lastSnap=0;
 function localSnap(force){
  if(!hasData())return Promise.resolve(false);
  if(!force&&Date.now()-lastSnap<30*60*1000)return Promise.resolve(false);
  lastSnap=Date.now();var s=full();
  return tx('snaps','readwrite',function(st){return st.put({day:today(),ts:Date.now(),size:s.length,bills:(D.bills||[]).length,data:s})})
   .then(function(){return snapsAll()})
   .then(function(a){var old=a.slice(KEEP);if(!old.length)return true;return tx('snaps','readwrite',function(st){old.forEach(function(o){st.delete(o.day)})}).then(function(){return true})})
   .then(function(r){LS('bkLocalAt',String(Date.now()));return r},function(){return false})}

 /* --- daily file: into a chosen folder (Chrome/Edge) or a normal download --- */
 var pend=null;
 function fileName(){return 'backup-'+today()+'.json'}
 function writeFile(auto){
  var name=fileName(),json=full();
  function dl(){saveFile(name,new Blob([json],{type:'application/json'}));LS('bkFileDay',today());return 'download'}
  return kvGet('dir').catch(function(){return null}).then(function(h){
   if(!h)return dl();
   return h.queryPermission({mode:'readwrite'}).then(function(p){
    if(p!=='granted'&&auto){showPend();return 'pending'}
    return (p==='granted'?Promise.resolve('granted'):h.requestPermission({mode:'readwrite'})).then(function(p2){
     if(p2!=='granted')return dl();
     return h.getFileHandle(name,{create:true}).then(function(fh){return fh.createWritable()}).then(function(w){return w.write(json).then(function(){return w.close()})}).then(function(){LS('bkFileDay',today());hidePend();return 'folder'})})})
  }).catch(function(){return dl()})}
 function showPend(){if(document.getElementById('bkpend'))return;var b=document.createElement('button');b.id='bkpend';b.className='b';b.style.cssText='position:fixed;right:18px;bottom:18px;z-index:60;box-shadow:0 4px 14px rgba(0,0,0,.25)';b.textContent='Click to save today\u2019s backup file';b.onclick=function(){writeFile(false).then(function(){hidePend();paint()})};document.body.appendChild(b)}
 function hidePend(){var b=document.getElementById('bkpend');if(b)b.remove()}

 /* --- email (needs the one-time Supabase function, see setup text) --- */
 function sendMail(){
  var to=(LS('bkEmail')||'').trim();
  if(!to)return Promise.reject(new Error('Type your email address first.'));
  if(!window.SB||!SB.functions)return Promise.reject(new Error('Not signed in to the cloud yet.'));
  return SB.functions.invoke('backup-email',{body:{to:to,filename:fileName(),json:full()}}).then(function(r){
   if(r&&r.error)throw new Error((r.error.message||'The email function is not set up yet.'));
   if(r&&r.data&&r.data.error)throw new Error(r.data.error);
   LS('bkMailDay',today());LS('bkMailAt',String(Date.now()));return true})}

 /* --- the daily job: runs a few seconds after opening and then every 30 minutes --- */
 function daily(){
  if(!hasData())return;
  localSnap(false);
  if(LS('bkFile')!=='0'&&LS('bkFileDay')!==today())writeFile(true).then(function(){paint()});
  if(LS('bkMail')==='1'&&(LS('bkEmail')||'').trim()&&LS('bkMailDay')!==today()&&window.SB)sendMail().then(paint,function(e){LS('bkMailErr',String(e&&e.message||e));paint()})}
 setTimeout(daily,8000);setInterval(daily,30*60*1000);
 document.addEventListener('visibilitychange',function(){if(document.hidden)localSnap(false)});

 /* --- merge a backup into the app (newer records stay) --- */
 function merge(x){
  if(!x||!x.items||!x.parties)throw new Error('This is not a backup file of this app.');
  ['parties','items','bills','pays','docs','trs','dsp'].forEach(function(c){
   if(!Array.isArray(x[c]))return;D[c]=D[c]||[];
   x[c].forEach(function(r){if(c==='bills'&&!r.id)r.id='b'+r.no;if(!r.id)return;var a=D[c],i=a.findIndex(function(z){return z.id===r.id});if(i<0)a.push(r);else a[i]=r})});
  if(x.shop)D.shop=x.shop;save();render()}
 window.bkRestoreLocal=function(day){
  if(!confirm('Restore records as they were on '+day+'? Newer bills and parties stay.'))return;
  tx('snaps','readonly',function(s){return s.get(day)}).then(function(r){try{merge(JSON.parse(r.data));alert('Restored')}catch(e){alert(e.message||'Could not restore')}},function(){alert('Could not read the copy')})};
 window.bkDownloadLocal=function(day){tx('snaps','readonly',function(s){return s.get(day)}).then(function(r){saveFile('backup-'+day+'.json',new Blob([r.data],{type:'application/json'}))})};
 window.bkNow=function(){say('bkSt','Saving...');localSnap(true).then(function(ok){say('bkSt',ok?'Saved a copy inside this browser.':'Could not save (browser storage blocked?)');paint()})};
 window.bkFileNow=function(){writeFile(false).then(function(r){say('bkSt',r==='folder'?'Saved into your backup folder.':'File downloaded.');paint()})};
 window.bkPickDir=function(){
  if(!window.showDirectoryPicker)return alert('Your browser cannot pick a folder. Use Chrome or Edge on the computer. Files will go to Downloads instead.');
  window.showDirectoryPicker({mode:'readwrite'}).then(function(h){return kvSet('dir',h)}).then(function(){LS('bkFileDay',null);say('bkSt','Folder chosen. Today\u2019s file will be saved there.');return writeFile(false)}).then(function(){paint()},function(){})};
 window.bkClearDir=function(){kvSet('dir',null).then(function(){hidePend();paint()})};
 window.bkOpt=function(k,v){LS(k,v);if(k==='bkMail'||k==='bkEmail')LS('bkMailErr',null);paint()};
 window.bkMailNow=function(){say('bkMailSt','Sending...');sendMail().then(function(){LS('bkMailErr',null);paint()},function(e){LS('bkMailErr',String(e&&e.message||e));paint()})};
 window.bkMailDraft=function(){var to=(LS('bkEmail')||'').trim();window.bkFileNow();location.href='mailto:'+encodeURIComponent(to)+'?subject='+encodeURIComponent('Backup '+today())+'&body='+encodeURIComponent('Attach the file backup-'+today()+'.json that was just saved.')};
 window.bkLoadFile=function(inp){var f=inp.files&&inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var x=JSON.parse(r.result);if(!x.items||!x.parties)throw new Error('This is not a backup file of this app.');if(confirm('Restore records from "'+f.name+'"? Newer bills and parties stay.')){merge(x);alert('Restored')}}catch(e){alert(e.message||'Invalid backup file')}inp.value=''};r.readAsText(f)};
 window.bkSetup=function(){var e=document.getElementById('bkSetup');if(e)e.style.display=e.style.display==='none'?'block':'none'};

 /* --- the Backup page card --- */
 function ago(t){if(!t)return 'never';var m=Math.round((Date.now()-t)/60000);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':new Date(t).toLocaleDateString('en-IN')}
 function card(){
  var fOn=LS('bkFile')!=='0',mOn=LS('bkMail')==='1',em=LS('bkEmail')||'';

<script id="fy-close">
/* CLOSE FINANCIAL YEAR (1 April to 31 March). Two choices:
   1) Keep everything: only saves a named year-end backup file and notes the year as closed.
   2) Start new year: saves the backup file, then removes that year's finished bills, payments and documents,
      and moves every party's balance into its Opening balance. Stock, godown records and unfinished work are kept. */
(function(){
 var FY={sy:null,mode:'keep',saved:false};
 function pad(n){return n<10?'0'+n:''+n}
 function lab(sy){return 'FY '+sy+'-'+String(sy+1).slice(2)}
 function endOf(sy){return new Date(sy+1,2,31,23,59,59,999).getTime()}
 function opts(){var n=new Date(),cur=n.getMonth()>=3?n.getFullYear():n.getFullYear()-1;return [cur-1,cur-2,cur-3]}
 function dated(r,end){var t=+r.date;return t>0&&t<=end}
 function pending(b){if(b.x)return false;return (b.lines||[]).some(function(l){try{return rem(l)>0}catch(e){return false}})}
 function openDoc(d){return d.st==='open'&&(d.t==='est'||d.t==='so'||d.t==='chal')}
 function plan(sy){
  var end=endOf(sy),keepB=[],keepP=[],keepD=[],cb=0,cp=0,cd=0,pend=0;
  (D.bills||[]).forEach(function(b){if(dated(b,end)&&!pending(b))cb++;else{keepB.push(b);if(dated(b,end))pend++}});
  (D.pays||[]).forEach(function(x){if(dated(x,end))cp++;else keepP.push(x)});
  (D.docs||[]).forEach(function(d){if(dated(d,end)&&!openDoc(d))cd++;else keepD.push(d)});
  return {end:end,keepB:keepB,keepP:keepP,keepD:keepD,cb:cb,cp:cp,cd:cd,pend:pend}}
 function ensure(){if(FY.sy==null)FY.sy=opts()[0]}
 window.fyCard=function(){ensure();
  var p=plan(FY.sy),done=(D.fyDone||[]).map(function(x){return esc(x.fy)+' (closed '+new Date(x.at).toLocaleDateString('en-IN')+')'}).join(', ');
  var sel='<select id="fysel" onchange="fyPick(this.value)" style="width:100%;margin:6px 0">'+opts().map(function(y){return '<option value="'+y+'"'+(y===FY.sy?' selected':'')+'>'+lab(y)+'  (1 Apr '+y+' to 31 Mar '+(y+1)+')</option>'}).join('')+'</select>';

   '<label style="display:flex;gap:10px;align-items:flex-start;margin:10px 0;cursor:pointer"><input type="radio" name="fym" '+(keep?'checked':'')+' onclick="fyMode(\'keep\')" style="width:20px;height:20px;margin:2px 0 0"><span><b>Keep everything</b> (safest)<br><span class="mu">All old bills stay in the app and in reports. Only the backup file is saved and the year is marked closed.</span></span></label>'+
   '<label style="display:flex;gap:10px;align-items:flex-start;margin:10px 0;cursor:pointer"><input type="radio" name="fym" '+(keep?'':'checked')+' onclick="fyMode(\'new\')" style="width:20px;height:20px;margin:2px 0 0"><span><b>Start a fresh year</b><br><span class="mu">Removes that year\'s finished bills, payments and documents. Every party\'s balance is carried forward as Opening balance. Stock is not changed. Bills with goods still to be sent stay.</span></span></label>'+
   (keep?'':'<div class="mu" style="background:#fff7e6;border:1px solid #f0d9a8;border-radius:8px;padding:8px;margin:6px 0">This will remove <b>'+p.cb+'</b> bills, <b>'+p.cp+'</b> payments and <b>'+p.cd+'</b> documents dated up to 31 Mar '+(FY.sy+1)+'.'+(p.pend?' <b>'+p.pend+'</b> bill(s) with goods still to be sent are kept.':'')+' With live sync on, other devices will remove them too. The backup file is the only full copy of the old year, so keep it safe. Bill numbers start again from 1.</div>')+
   '<button class="b" style="width:100%;margin-top:6px" onclick="fyBackup()">1. Save '+lab(FY.sy)+' backup file</button>'+
   '<button class="'+(FY.saved?'b':'s')+'" style="width:100%;margin-top:8px" onclick="fyRun()">2. '+(keep?'Mark '+lab(FY.sy)+' as closed':'Close '+lab(FY.sy)+' and start new year')+'</button>'+
   (done?'<div class="mu" style="margin-top:8px">Closed so far: '+done+'</div>':'')+'</div>'};
 window.fyPick=function(v){FY.sy=+v;FY.saved=false;render()};
 window.fyMode=function(m){FY.mode=m;render()};
 window.fyBackup=function(){ensure();
  saveFile(lab(FY.sy).replace(' ','')+'-year-end-backup-'+new Date().toISOString().slice(0,10)+'.json',new Blob([JSON.stringify(D)],{type:'application/json'}));
  FY.saved=true;setTimeout(function(){alert('The backup file is being saved to this device. Check your Downloads (or Files) and keep it safe, then press button 2.');render()},400)};
 function closeKeep(){D.fyDone=(D.fyDone||[]).concat([{fy:lab(FY.sy),at:Date.now(),mode:'keep'}]);save();FY.saved=false;render();alert(lab(FY.sy)+' is marked as closed. Nothing was removed.')}

  var rest={};D.parties.forEach(function(x){rest[x.id]=bal(x)-(+x.open||0)});
  D.parties.forEach(function(x){x.open=Math.round((before[x.id]-rest[x.id])*100)/100});BC=null;
  var bad=D.parties.filter(function(x){return Math.abs(bal(x)-before[x.id])>0.01});
  if(bad.length){D.bills=oldB;D.pays=oldP;D.docs=oldD;D.parties.forEach(function(x){x.open=oldOpen[x.id]});BC=null;alert('Stopped: balances did not match for '+bad.length+' party(s), so NOTHING was changed. Please send us your backup file.');return}
  D.fyDone=(D.fyDone||[]).concat([{fy:lab(FY.sy),at:Date.now(),mode:'new',removed:{bills:p.cb,pays:p.cp,docs:p.cd}}]);
  save();FY.saved=false;FY.mode='keep';render();
  alert(lab(FY.sy)+' is closed. Balances of all parties were carried forward as Opening balance. Removed: '+p.cb+' bills, '+p.cp+' payments, '+p.cd+' documents.')}
 window.fyRun=function(){ensure();
  if(!FY.saved)return alert('First press button 1 to save the backup file.');
  if(!confirm('Did the backup file of '+lab(FY.sy)+' save on this device? Without it the old bills cannot be brought back.'))return;
  if(FY.mode==='keep')return closeKeep();
  if(!confirm('Close '+lab(FY.sy)+' and start a fresh year? Old finished bills, payments and documents of that year will be removed from the app.'))return;
  closeNew()};
 var _v=window.vBk||vBk;
 vBk=function(){return _v.apply(this,arguments)+fyCard()};
})();
</script>
